<script>
/* ==================================================================
   SHAPE — engine
   Filter design, state, analyser model, interaction and the frame loop.
   Drawing lives in canvas.js; controls in knobs.html.

   The response curve is computed, never drawn: real RBJ-cookbook biquad
   sections, cascaded per band, evaluated as 20*log10|H(e^jw)| at every
   pixel column.
   ================================================================== */
"use strict";

var FS = 48000;
var NYQ = FS / 2;
var FMIN = 10, FMAX = 30000;
var LOG_MIN = Math.log(FMIN), LOG_SPAN = Math.log(FMAX) - LOG_MIN;
var GAIN_RANGE = 24;          /* left axis, ±24 dB — as the reference draws it */

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function fToNorm(f) { return (Math.log(clamp(f, FMIN, FMAX)) - LOG_MIN) / LOG_SPAN; }
function normToF(t) { return Math.exp(LOG_MIN + t * LOG_SPAN); }

/* ---------- filter catalogue ---------------------------------- */
var TYPES = {
  bell:      { label: "Bell",       gain: true,  q: true,  slope: false },
  lowshelf:  { label: "Low Shelf",  gain: true,  q: true,  slope: false },
  highshelf: { label: "High Shelf", gain: true,  q: true,  slope: false },
  tilt:      { label: "Tilt Shelf", gain: true,  q: true,  slope: false },
  lowcut:    { label: "Low Cut",    gain: false, q: false, slope: true  },
  highcut:   { label: "High Cut",   gain: false, q: false, slope: true  },
  notch:     { label: "Notch",      gain: false, q: true,  slope: false },
  bandpass:  { label: "Band Pass",  gain: false, q: true,  slope: false }
};

/* ---------- biquad design (RBJ Audio EQ Cookbook) -------------- */
function butterworthQs(order) {
  var qs = [];
  for (var k = 0; k < Math.floor(order / 2); k++) {
    qs.push(1 / (2 * Math.cos(((2 * k + 1) * Math.PI) / (2 * order))));
  }
  return qs;
}
function sec(b0, b1, b2, a0, a1, a2) {
  return { b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0 };
}
function peaking(f0, g, Q) {
  var A = Math.pow(10, g / 40);
  var w = 2 * Math.PI * f0 / FS, cw = Math.cos(w), al = Math.sin(w) / (2 * Q);
  return sec(1 + al * A, -2 * cw, 1 - al * A, 1 + al / A, -2 * cw, 1 - al / A);
}
function lowShelf(f0, g, Q) {
  var A = Math.pow(10, g / 40), sA = Math.sqrt(A);
  var w = 2 * Math.PI * f0 / FS, cw = Math.cos(w), al = Math.sin(w) / (2 * Q), t = 2 * sA * al;
  return sec(A * ((A + 1) - (A - 1) * cw + t),
             2 * A * ((A - 1) - (A + 1) * cw),
             A * ((A + 1) - (A - 1) * cw - t),
             (A + 1) + (A - 1) * cw + t,
             -2 * ((A - 1) + (A + 1) * cw),
             (A + 1) + (A - 1) * cw - t);
}
function highShelf(f0, g, Q) {
  var A = Math.pow(10, g / 40), sA = Math.sqrt(A);
  var w = 2 * Math.PI * f0 / FS, cw = Math.cos(w), al = Math.sin(w) / (2 * Q), t = 2 * sA * al;
  return sec(A * ((A + 1) + (A - 1) * cw + t),
             -2 * A * ((A - 1) + (A + 1) * cw),
             A * ((A + 1) + (A - 1) * cw - t),
             (A + 1) - (A - 1) * cw + t,
             2 * ((A - 1) - (A + 1) * cw),
             (A + 1) - (A - 1) * cw - t);
}
function highPass2(f0, Q) {
  var w = 2 * Math.PI * f0 / FS, cw = Math.cos(w), al = Math.sin(w) / (2 * Q);
  return sec((1 + cw) / 2, -(1 + cw), (1 + cw) / 2, 1 + al, -2 * cw, 1 - al);
}
function lowPass2(f0, Q) {
  var w = 2 * Math.PI * f0 / FS, cw = Math.cos(w), al = Math.sin(w) / (2 * Q);
  return sec((1 - cw) / 2, 1 - cw, (1 - cw) / 2, 1 + al, -2 * cw, 1 - al);
}
function highPass1(f0) {
  var K = Math.tan(Math.PI * f0 / FS), n = 1 / (1 + K);
  return { b0: n, b1: -n, b2: 0, a1: (K - 1) * n, a2: 0 };
}
function lowPass1(f0) {
  var K = Math.tan(Math.PI * f0 / FS), n = 1 / (1 + K);
  return { b0: K * n, b1: K * n, b2: 0, a1: (K - 1) * n, a2: 0 };
}
function notchSec(f0, Q) {
  var w = 2 * Math.PI * f0 / FS, cw = Math.cos(w), al = Math.sin(w) / (2 * Q);
  return sec(1, -2 * cw, 1, 1 + al, -2 * cw, 1 - al);
}
function bandPassSec(f0, Q) {
  var w = 2 * Math.PI * f0 / FS, cw = Math.cos(w), al = Math.sin(w) / (2 * Q);
  return sec(al, 0, -al, 1 + al, -2 * cw, 1 - al);
}

function designBand(band, gainDb) {
  var f0 = clamp(band.freq, FMIN, NYQ * 0.995);
  var Q = clamp(band.q, 0.1, 100);
  switch (band.type) {
    case "bell":      return [peaking(f0, gainDb, Q)];
    case "lowshelf":  return [lowShelf(f0, gainDb, Q)];
    case "highshelf": return [highShelf(f0, gainDb, Q)];
    case "tilt":      return [lowShelf(f0, -gainDb, Q), highShelf(f0, gainDb, Q)];
    case "notch":     return [notchSec(f0, Q)];
    case "bandpass":  return [bandPassSec(f0, Q)];
    case "lowcut":
    case "highcut": {
      var order = Math.max(1, Math.round(band.slope / 6));
      var out = [], qs = butterworthQs(order), i;
      if (order % 2 === 1) out.push(band.type === "lowcut" ? highPass1(f0) : lowPass1(f0));
      for (i = 0; i < qs.length; i++) {
        out.push(band.type === "lowcut" ? highPass2(f0, qs[i]) : lowPass2(f0, qs[i]));
      }
      return out;
    }
    default: return [];
  }
}
function cascadeDb(sections, c1, s1, c2, s2) {
  var db = 0;
  for (var i = 0; i < sections.length; i++) {
    var s = sections[i];
    var nr = s.b0 + s.b1 * c1 + s.b2 * c2, ni = -(s.b1 * s1 + s.b2 * s2);
    var dr = 1 + s.a1 * c1 + s.a2 * c2, di = -(s.a1 * s1 + s.a2 * s2);
    db += 10 * Math.log10((nr * nr + ni * ni) / (dr * dr + di * di) + 1e-30);
  }
  return db;
}

/* ---------- state --------------------------------------------- */
function mkBand(type, freq, gain, q, extra) {
  var b = {
    type: type, freq: freq, gain: gain, q: q, slope: 12, on: true,
    dyn: { on: false, range: -6, threshold: -24, attack: 10, release: 120, cur: 0 }
  };
  if (extra) for (var k in extra) b[k] = extra[k];
  return b;
}

var PRESETS = [
  { name: "Master Clean", tag: "PRECISION · MUSICAL · NATURAL", bands: [
    mkBand("lowcut", 36, 0, 0.71, { slope: 12 }),
    mkBand("bell", 104, 6.4, 0.9),
    mkBand("bell", 512, -4.8, 2.4, { dyn: { on: true, range: -6, threshold: -24, attack: 10, release: 120, cur: 0 } }),
    mkBand("bell", 3800, 6.2, 0.85),
    mkBand("bell", 15000, 4.4, 0.8)
  ]},
  { name: "Vocal Presence", tag: "FORWARD · CLEAR · INTIMATE", bands: [
    mkBand("lowcut", 92, 0, 0.71, { slope: 24 }),
    mkBand("bell", 268, -3.4, 1.6),
    mkBand("bell", 2900, 4.6, 1.1),
    mkBand("bell", 6400, -4.2, 5.5, { dyn: { on: true, range: -5, threshold: -22, attack: 3, release: 80, cur: 0 } }),
    mkBand("highshelf", 10500, 3.8, 0.7)
  ]},
  { name: "Drum Punch", tag: "TIGHT · PUNCHY · OPEN", bands: [
    mkBand("lowcut", 28, 0, 0.71, { slope: 18 }),
    mkBand("bell", 68, 5.6, 1.3),
    mkBand("bell", 420, -5.0, 1.8),
    mkBand("bell", 3400, 4.2, 1.0),
    mkBand("highshelf", 9000, 3.4, 0.7)
  ]},
  { name: "Bass Control", tag: "DEEP · CONTROLLED · SOLID", bands: [
    mkBand("lowcut", 30, 0, 0.71, { slope: 36 }),
    mkBand("bell", 82, 4.0, 1.1),
    mkBand("bell", 180, -5.5, 2.2, { dyn: { on: true, range: -8, threshold: -20, attack: 14, release: 180, cur: 0 } }),
    mkBand("bell", 900, 2.6, 1.4),
    mkBand("highcut", 12000, 0, 0.71, { slope: 12 })
  ]},
  { name: "Air Lift", tag: "SILKY · OPEN · TALL", bands: [
    mkBand("bell", 340, -2.4, 1.4),
    mkBand("highshelf", 7800, 4.4, 0.6),
    mkBand("bell", 15500, 3.8, 0.9)
  ]},
  { name: "Surgical Repair", tag: "NARROW · SURGICAL · EXACT", bands: [
    mkBand("notch", 60, 0, 30),
    mkBand("notch", 180, 0, 30),
    mkBand("bell", 3150, -8.5, 12),
    mkBand("highshelf", 11000, 2.4, 0.7)
  ]}
];

var ST = {
  presetIndex: 0,
  bands: JSON.parse(JSON.stringify(PRESETS[0].bands)),
  selected: 2,
  slot: "A",
  analyzerOn: true,
  analyzerMode: "pre",          /* pre | post | both */
  tab: "eq",                    /* eq | dynamic | spectral */
  phase: "zero",
  fineScale: 12,                /* right-hand ruler range, matches SCALE control */
  mode: "clean",
  input: 0,
  output: 0,
  solo: false,
  power: true,
  sidechain: false,
  bypass: false
};
function cur() { return ST; }
function selBand() { return ST.bands[ST.selected]; }

/* ---------- undo / redo (gestures grouped) --------------------- */
var History = {
  past: [], future: [],
  snap: function () { return JSON.stringify(ST); },
  restore: function (s) {
    var o = JSON.parse(s);
    for (var k in o) ST[k] = o[k];
  },
  push: function (prev) {
    this.past.push(prev);
    if (this.past.length > 120) this.past.shift();
    this.future.length = 0;
  },
  undo: function () {
    if (!this.past.length) return;
    var now = this.snap(); this.restore(this.past.pop()); this.future.push(now); syncAll();
  },
  redo: function () {
    if (!this.future.length) return;
    var now = this.snap(); this.restore(this.future.pop()); this.past.push(now); syncAll();
  }
};
var gestureSnap = null;
function beginGesture() { if (gestureSnap === null) gestureSnap = History.snap(); }
function endGesture() {
  if (gestureSnap !== null && gestureSnap !== History.snap()) History.push(gestureSnap);
  gestureSnap = null;
}
function commit(fn) {
  var before = History.snap(); fn();
  if (before !== History.snap()) History.push(before);
}

/* ---------- analyser model ------------------------------------- */
var NBINS = 420;
var binF = new Float64Array(NBINS);
var binT = new Float64Array(NBINS);
for (var _i = 0; _i < NBINS; _i++) {
  binT[_i] = _i / (NBINS - 1);
  binF[_i] = normToF(binT[_i]);
}
var specRaw = new Float64Array(NBINS);
var specDisp = new Float64Array(NBINS);
var specPeak = new Float64Array(NBINS);
var texture = new Float64Array(NBINS);
for (var _j = 0; _j < NBINS; _j++) { specDisp[_j] = -90; specPeak[_j] = -120; }

var T = 0;
function updateSpectrum(dt) {
  T += dt;
  var bassF = 58 * Math.pow(2, 0.42 * Math.sin(T * 0.27) + 0.22 * Math.sin(T * 0.63));
  var midEnv = 0.62 + 0.38 * Math.sin(T * 0.41 + 1.2);
  var hfEnv = 0.55 + 0.45 * Math.sin(T * 0.53 + 2.6);
  var snare = Math.pow(Math.max(0, Math.sin(T * 2.1)), 6);
  var i, f, v, amp;

  for (i = 0; i < NBINS; i++) {
    f = binF[i];
    v = -13 - 11.5 * Math.log10(Math.max(f, 20) / 42);
    v += 17 * Math.exp(-Math.pow(Math.log(f / bassF) / Math.LN2 / 0.5, 2));
    v += 10 * Math.exp(-Math.pow(Math.log(f / (bassF * 2)) / Math.LN2 / 0.45, 2));
    v += 6 * Math.exp(-Math.pow(Math.log(f / (bassF * 3)) / Math.LN2 / 0.42, 2));
    v += 8 * midEnv * Math.exp(-Math.pow(Math.log(f / 620) / Math.LN2 / 1.15, 2));
    v += 7 * hfEnv * Math.exp(-Math.pow(Math.log(f / 3600) / Math.LN2 / 1.05, 2));
    v += 9 * snare * Math.exp(-Math.pow(Math.log(f / 1900) / Math.LN2 / 1.4, 2));
    amp = 2.4 + 3.6 * Math.min(1, f / 2500);
    texture[i] += ((Math.random() * 2 - 1) * amp - texture[i]) * 0.34;
    specRaw[i] = v + texture[i];
  }
  for (i = 1; i < NBINS - 1; i++) {
    specRaw[i] = specRaw[i] * 0.5 + specRaw[i - 1] * 0.25 + specRaw[i + 1] * 0.25;
  }
  for (i = 0; i < NBINS; i++) {
    var t = specRaw[i];
    specDisp[i] += (t - specDisp[i]) * (t > specDisp[i] ? 0.52 : 0.045);
    specPeak[i] = Math.max(specPeak[i] - 26 * dt, specDisp[i]);
  }
}

function detectorLevel(band) {
  var bw = (band.type === "bell" || band.type === "notch" || band.type === "bandpass")
    ? clamp(1 / Math.max(band.q, 0.2), 0.12, 2.2) : 1.0;
  var sum = 0, wsum = 0;
  for (var i = 0; i < NBINS; i++) {
    var oct = Math.log(binF[i] / band.freq) / Math.LN2;
    var w = Math.exp(-Math.pow(oct / bw, 2));
    if (w < 0.02) continue;
    sum += Math.pow(10, specDisp[i] / 10) * w;
    wsum += w;
  }
  return 10 * Math.log10(sum / Math.max(wsum, 1e-9) + 1e-12);
}
function updateDynamics(dt) {
  for (var i = 0; i < ST.bands.length; i++) {
    var b = ST.bands[i];
    if (!b.dyn.on || !b.on || ST.bypass) { b.dyn.cur *= 0.85; continue; }
    var over = detectorLevel(b) - b.dyn.threshold;
    var amount = over > 0 ? clamp(over / 2.5 / Math.max(Math.abs(b.dyn.range), 0.001), 0, 1) : 0;
    var target = b.dyn.range * amount;
    var moving = Math.abs(target) > Math.abs(b.dyn.cur);
    var tau = (moving ? b.dyn.attack : b.dyn.release) / 1000;
    b.dyn.cur += (target - b.dyn.cur) * clamp(1 - Math.exp(-dt / Math.max(tau, 0.0005)), 0, 1);
  }
}

/* ---------- canvas geometry ------------------------------------ */
var cv, ctx, CW = 0, CH = 0, DPR = 1;
var PAD = { l: 46, r: 46, t: 52, b: 26 };   /* t clears the floating toolbar */
function plot() {
  return { x: PAD.l, y: PAD.t, w: Math.max(10, CW - PAD.l - PAD.r), h: Math.max(10, CH - PAD.t - PAD.b) };
}
function xOfF(f) { var p = plot(); return p.x + fToNorm(f) * p.w; }
function fOfX(x) { var p = plot(); return normToF(clamp((x - p.x) / p.w, 0, 1)); }
function yOfDb(db) { var p = plot(); return p.y + p.h * (GAIN_RANGE - db) / (2 * GAIN_RANGE); }
function dbOfY(y) { var p = plot(); return GAIN_RANGE - ((y - p.y) / p.h) * 2 * GAIN_RANGE; }
/* right-hand fine ruler: the SCALE control picks its range, and it is a
   gain ruler, not a level meter — exactly as the reference draws it */
function yOfFs(v) { return yOfDb(v * (GAIN_RANGE / ST.fineScale)); }
/* analyser magnitudes get their own mapping across the plot */
var A_TOP = 26, A_BOT = -74;
function yOfLevel(dbfs) { var p = plot(); return p.y + p.h * (A_TOP - dbfs) / (A_TOP - A_BOT); }

function resizeCanvas() {
  var r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  CW = Math.max(240, Math.round(r.width));
  CH = Math.max(160, Math.round(r.height));
  cv.width = Math.round(CW * DPR);
  cv.height = Math.round(CH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/* ---------- response ------------------------------------------- */
var respLive = new Float64Array(0), respStatic = new Float64Array(0),
    respRange = new Float64Array(0), respW = 0;

function computeResponses(width) {
  if (respW !== width) {
    respLive = new Float64Array(width);
    respStatic = new Float64Array(width);
    respRange = new Float64Array(width);
    respW = width;
  }
  respLive.fill(0); respStatic.fill(0); respRange.fill(0);
  if (ST.bypass || !ST.power) return;

  var sel = ST.bands[ST.selected];
  for (var bi = 0; bi < ST.bands.length; bi++) {
    var band = ST.bands[bi];
    if (!band.on) continue;
    if (ST.solo && band !== sel) continue;
    var g = TYPES[band.type].gain ? band.gain : 0;
    var sS = designBand(band, g);
    var sL = band.dyn.on ? designBand(band, g + band.dyn.cur) : sS;
    var sR = band.dyn.on ? designBand(band, g + band.dyn.range) : sS;

    for (var x = 0; x < width; x++) {
      var f = normToF(x / (width - 1));
      var w = Math.min(2 * Math.PI * f / FS, Math.PI * 0.9995);
      var c1 = Math.cos(w), s1 = Math.sin(w), c2 = Math.cos(2 * w), s2 = Math.sin(2 * w);
      var dS = cascadeDb(sS, c1, s1, c2, s2);
      respStatic[x] += dS;
      respLive[x] += (sL === sS) ? dS : cascadeDb(sL, c1, s1, c2, s2);
      respRange[x] += (sR === sS) ? dS : cascadeDb(sR, c1, s1, c2, s2);
    }
  }
}
function respAtF(f) {
  if (!respW) return 0;
  return respLive[clamp(Math.round(fToNorm(f) * (respW - 1)), 0, respW - 1)];
}

/* ---------- formatting ----------------------------------------- */
function fmtFreq(f) {
  if (f >= 10000) return (f / 1000).toFixed(1) + " kHz";
  if (f >= 1000) return (f / 1000).toFixed(2) + " kHz";
  return f.toFixed(f < 100 ? 1 : 0) + " Hz";
}
function fmtDb(v) { return (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(1) + " dB"; }

/* ---------- canvas interaction --------------------------------- */
var hover = { x: -1, y: -1, inside: false, node: -1 };
var drag = null;

function nodeY(band) {
  var g = TYPES[band.type].gain ? band.gain + (band.dyn.on ? band.dyn.cur : 0) : 0;
  return yOfDb(g);
}
function localPt(e) {
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function hitNode(pt) {
  var best = -1, bestD = 18 * 18;
  for (var i = 0; i < ST.bands.length; i++) {
    var b = ST.bands[i];
    var dx = xOfF(b.freq) - pt.x, dy = nodeY(b) - pt.y;
    var d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

function bindCanvas() {
  cv.addEventListener("pointermove", function (e) {
    var pt = localPt(e), p = plot();
    hover.x = pt.x; hover.y = pt.y;
    hover.inside = pt.x >= p.x && pt.x <= p.x + p.w && pt.y >= p.y && pt.y <= p.y + p.h;
    if (drag) {
      var b = ST.bands[drag.i], fine = e.shiftKey ? 0.22 : 1;
      b.freq = clamp(fOfX(drag.sx + (pt.x - drag.px) * fine), FMIN + 2, 30000);
      if (TYPES[b.type].gain) b.gain = clamp(dbOfY(drag.sy + (pt.y - drag.py) * fine), -24, 24);
      syncBandControls();
      return;
    }
    hover.node = hitNode(pt);
    cv.style.cursor = hover.node >= 0 ? "grab" : "crosshair";
  });
  cv.addEventListener("pointerleave", function () { hover.inside = false; hover.node = -1; });

  cv.addEventListener("pointerdown", function (e) {
    var pt = localPt(e), i = hitNode(pt);
    if (i < 0) return;
    if (e.altKey) { commit(function () { ST.bands[i].on = !ST.bands[i].on; }); syncAll(); return; }
    beginGesture();
    ST.selected = i;
    drag = { i: i, px: pt.x, py: pt.y, sx: xOfF(ST.bands[i].freq), sy: nodeY(ST.bands[i]) };
    cv.setPointerCapture(e.pointerId);
    cv.style.cursor = "grabbing";
    syncAll();
  });
  function up() { if (drag) { drag = null; endGesture(); cv.style.cursor = "crosshair"; } }
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", up);

  cv.addEventListener("wheel", function (e) {
    var i = hover.node >= 0 ? hover.node : hitNode(localPt(e));
    if (i < 0) return;
    var b = ST.bands[i];
    if (!TYPES[b.type].q) return;
    e.preventDefault();
    beginGesture();
    ST.selected = i;
    b.q = clamp(b.q * Math.exp(-e.deltaY * 0.0016 * (e.shiftKey ? 0.3 : 1)), 0.1, 100);
    syncBandControls();
    clearTimeout(cv._wt);
    cv._wt = setTimeout(endGesture, 350);
  }, { passive: false });

  cv.addEventListener("dblclick", function (e) {
    var pt = localPt(e), p = plot();
    if (hitNode(pt) >= 0 || pt.x < p.x || pt.x > p.x + p.w) return;
    if (ST.bands.length >= 24) return;
    commit(function () {
      var f = Math.round(fOfX(pt.x));
      ST.bands.push(mkBand("bell", f, +clamp(dbOfY(pt.y), -24, 24).toFixed(1), 1.0));
      ST.bands.sort(function (a, b) { return a.freq - b.freq; });
      for (var i = 0; i < ST.bands.length; i++) if (ST.bands[i].freq === f) { ST.selected = i; break; }
    });
    syncAll();
  });

  cv.addEventListener("contextmenu", function (e) {
    var i = hitNode(localPt(e));
    if (i < 0) return;
    e.preventDefault();
    removeBand(i);
  });

  window.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea") return;
    var k = e.key.toLowerCase();
    if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); removeBand(ST.selected); }
    else if ((e.metaKey || e.ctrlKey) && k === "z") { e.preventDefault(); e.shiftKey ? History.redo() : History.undo(); }
    else if (e.key === "[") { ST.selected = (ST.selected - 1 + ST.bands.length) % ST.bands.length; syncAll(); }
    else if (e.key === "]") { ST.selected = (ST.selected + 1) % ST.bands.length; syncAll(); }
  });
}
function removeBand(i) {
  if (ST.bands.length <= 1 || i < 0 || i >= ST.bands.length) return;
  commit(function () {
    ST.bands.splice(i, 1);
    ST.selected = clamp(ST.selected, 0, ST.bands.length - 1);
  });
  syncAll();
}

function loadPreset(i) {
  commit(function () {
    ST.presetIndex = ((i % PRESETS.length) + PRESETS.length) % PRESETS.length;
    ST.bands = JSON.parse(JSON.stringify(PRESETS[ST.presetIndex].bands));
    ST.selected = Math.min(ST.selected, ST.bands.length - 1);
  });
  syncAll();
}

/* ---------- frame loop ----------------------------------------- */
var lastT = 0;
var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function frame(now) {
  var dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!reducedMotion && ST.analyzerOn) updateSpectrum(dt);
  updateDynamics(dt);

  var p = plot();
  computeResponses(Math.max(64, Math.round(p.w)));

  ctx.clearRect(0, 0, CW, CH);
  drawWell(ctx, p);
  if (ST.analyzerOn) {
    if (ST.analyzerMode === "pre" || ST.analyzerMode === "both") drawSpectrum(ctx, p);
    if (ST.analyzerMode === "post" || ST.analyzerMode === "both") drawSpectrumPost(ctx, p);
  }
  /* the tabs change emphasis rather than hiding anything: SPECTRAL pushes
     the curve back so the analyser reads, DYNAMIC does the reverse */
  ctx.save();
  if (ST.tab === "spectral") ctx.globalAlpha = 0.35;
  drawResponse(ctx, p, ST.bands);
  drawNodes(ctx, p, ST.bands, ST.selected, hover.node);
  ctx.restore();
  if (hover.inside && !drag) {
    var f = fOfX(hover.x);
    drawHoverGuide(ctx, p, hover.x, f, respAtF(f));
  }
  drawAxes(ctx, p);

  requestAnimationFrame(frame);
}

function bootEngine() {
  cv = document.getElementById("shape-graph");
  ctx = cv.getContext("2d");
  if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(cv);
  else window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  bindCanvas();
  buildControls();
  syncAll();
  for (var i = 0; i < 45; i++) updateSpectrum(1 / 60);   /* settle before first paint */
  lastT = performance.now();
  requestAnimationFrame(frame);
}

</script>

<script>
/* ===========================================================================
   SHAPE — canvas rendering layer
   ---------------------------------------------------------------------------
   Pure drawing only. No state, no timers, no listeners, no DOM.
   Every function saves and restores the context, so nothing leaks between
   passes (globalAlpha, shadowBlur, lineDash, strokeStyle, fonts, clips).

   Assumes these already exist as globals:
     FMIN FMAX FS NBINS
     xOfF(f) fOfX(x) yOfDb(db) dbOfY(y) yOfFs(dbfs)
     plot() -> {x,y,w,h}
     respLive respStatic respRange   (dB per pixel column)
     specDisp specPeak binF          (Float64Array(NBINS))
     cur() -> {bands, selected, bypass}

   Public:
     bandHue(band, i[, selectedIndex])
     drawWell(ctx, p)
     drawAxes(ctx, p)
     drawSpectrum(ctx, p)
     drawResponse(ctx, p, bands)
     drawNodes(ctx, p, bands, selectedIndex, hoverIndex)
     drawHoverGuide(ctx, p, mouseX, freq, db)

   Everything prefixed _shp / _SHP is private to this file. This file is
   concatenated into a single inline <script>, so it is written in plain ES5
   with top-level function declarations and no module syntax.
   =========================================================================== */

/* ---- locked tokens ------------------------------------------------------ */
var _SHP_WELL_BG    = '#0C0E12';
var _SHP_WELL_BG2   = '#171B21';
var _SHP_WELL_LINE  = '#262B33';
var _SHP_ON_DARK    = '#C8CFD8';
var _SHP_ON_DARK2   = '#7B838E';
var _SHP_AMBER      = '#FF9E2C';
var _SHP_CYAN       = '#45C2F0';
var _SHP_VIOLET     = '#9B7BF0';
var _SHP_GREEN      = '#6FC98A';
var _SHP_ORANGE     = '#FFA53D';

/* Band hue cycle — ordered so neighbouring bands never share a hue. */
var _SHP_PALETTE = ['#45C2F0', '#9B7BF0', '#FFA53D', '#45C2F0', '#6FC98A', '#9B7BF0'];

var _SHP_FONT = '400 10px Inter, system-ui, sans-serif';
var _SHP_TAU  = Math.PI * 2;

var _SHP_NYQ_DRAW = 24000;   /* analyser stops here */

var _SHP_GRID_F = [20, 30, 40, 50, 70, 100, 200, 300, 400, 500, 700,
                   1000, 2000, 3000, 4000, 5000, 7000, 10000, 20000];

/* the subset that carries a label, and therefore a brighter gridline */
var _SHP_LABEL_F = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];
var _SHP_LABEL_TEXT = {
  20: '20', 50: '50', 100: '100', 200: '200', 500: '500',
  1000: '1k', 2000: '2k', 5000: '5k', 10000: '10k', 20000: '20k'
};

var _SHP_DB_TICKS = [24, 18, 12, 6, 0, -6, -12, -18, -24];
var _SHP_FS_TICKS = [12, 6, 0, -6, -12];

/* types that carry no gain — their node rides the 0 dB line */
var _SHP_NO_GAIN = { lowcut: 1, highcut: 1, notch: 1, bandpass: 1 };

/* Ticks for the right-hand fine ruler. That ruler's range is set by the SCALE
   control, so the ticks follow it: at the default (±12) this is exactly the
   locked list, and at any other setting the ruler stays honest rather than
   printing a number against the wrong line. */
function _shpFineTicks() {
  var fs = 12;
  if (typeof cur === 'function') {
    var st = cur();
    if (st && typeof st.fineScale === 'number' && isFinite(st.fineScale) && st.fineScale > 0) {
      fs = st.fineScale;
    }
  }
  if (fs === 12) return _SHP_FS_TICKS;
  return [fs, fs / 2, 0, -fs / 2, -fs];
}


/* ---- private helpers ---------------------------------------------------- */

function _shpClamp(v, lo, hi) {
  return v < lo ? lo : (v > hi ? hi : v);
}

/* plot rect, with a fallback so a caller may omit it */
function _shpRect(p) {
  if (p && typeof p.w === 'number') return p;
  return (typeof plot === 'function') ? plot() : { x: 0, y: 0, w: 0, h: 0 };
}

/* '#45C2F0' + alpha -> 'rgba(69,194,240,.28)' */
function _shpRgba(hex, a) {
  var h = String(hex == null ? '' : hex).replace('#', '');
  if (h.length === 3) {
    h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
  }
  var n = parseInt(h, 16);
  if (h.length !== 6 || isNaN(n)) return 'rgba(200,210,222,' + a + ')';
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

/* resolve the selected index when a caller did not hand one over */
function _shpSelected(selectedIndex) {
  if (typeof selectedIndex === 'number') return selectedIndex;
  if (typeof cur === 'function') {
    var st = cur();
    if (st && typeof st.selected === 'number') return st.selected;
  }
  return -1;
}

function _shpBands(bands) {
  if (bands && bands.length) return bands;
  if (typeof cur === 'function') {
    var st = cur();
    if (st && st.bands) return st.bands;
  }
  return [];
}

/* gain the node actually sits at: static gain plus live dynamic movement */
function _shpBandGain(band) {
  if (!band) return 0;
  if (_SHP_NO_GAIN[band.type]) return 0;
  var g = (typeof band.gain === 'number') ? band.gain : 0;
  if (band.dyn && band.dyn.on && typeof band.dyn.cur === 'number') g += band.dyn.cur;
  return g;
}

/* open polyline along a dB array, one sample per pixel column.
   Does not begin or close the path — the caller owns that. */
function _shpRespPath(ctx, p, arr) {
  var n = arr.length;
  if (n < 2) return false;
  var lo = p.y - 200, hi = p.y + p.h + 200;
  for (var i = 0; i < n; i++) {
    var px = p.x + (i / (n - 1)) * p.w;
    var py = _shpClamp(yOfDb(arr[i]), lo, hi);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  return true;
}

/* open polyline across the analyser bins. Returns the span it covered so the
   caller can close it down to the floor, or null when nothing was drawn.
   Deliberately point-to-point — the analyser must stay jagged. */
function _shpSpecPath(ctx, p, arr) {
  if (!arr || !arr.length) return null;
  var n = Math.min(NBINS, arr.length, binF.length);
  var lo = p.y - 40, hi = p.y + p.h + 40;
  var started = false, first = 0, last = 0;
  for (var i = 0; i < n; i++) {
    var f = binF[i];
    if (f > _SHP_NYQ_DRAW) break;
    var x = xOfF(f);
    var y = _shpClamp(yOfLevel(arr[i]), lo, hi);
    if (!started) { ctx.moveTo(x, y); first = x; started = true; }
    else ctx.lineTo(x, y);
    last = x;
  }
  return started ? { first: first, last: last } : null;
}

function _shpRoundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function _shpFmtHz(f) {
  if (typeof f !== 'number' || !isFinite(f)) return '--';
  if (f >= 10000) return (Math.round(f / 100) / 10) + ' kHz';
  if (f >= 1000)  return (Math.round(f / 10) / 100) + ' kHz';
  return Math.round(f) + ' Hz';
}

function _shpFmtDb(db) {
  if (typeof db !== 'number' || !isFinite(db)) return '-- dB';
  var v = Math.abs(db) < 0.05 ? 0 : db;
  var sign = v < 0 ? '−' : '+';
  return sign + Math.abs(v).toFixed(1) + ' dB';
}


/* ---- hue ---------------------------------------------------------------- */
/* Selection wins over everything: amber marks the current band and nothing
   else, which is what keeps one node readable against a full spectrum.
   A dynamic band is violet. Otherwise the band takes its slot in the cycle. */
function bandHue(band, i, selectedIndex) {
  if (!band) return _SHP_CYAN;
  var sel = _shpSelected(selectedIndex);
  if (typeof i === 'number' && i >= 0 && i === sel) return _SHP_AMBER;
  if (band.dyn && band.dyn.on) return _SHP_VIOLET;
  var idx = (typeof i === 'number' && i >= 0) ? (i % _SHP_PALETTE.length) : 0;
  return _SHP_PALETTE[idx];
}


/* ---- the well: ground, then grid ---------------------------------------- */
function drawWell(ctx, p) {
  ctx.save();
  p = _shpRect(p);
  if (p.w <= 0 || p.h <= 0) { ctx.restore(); return; }

  var bottom = p.y + p.h, right = p.x + p.w, i, v, x, y;

  var g = ctx.createLinearGradient(0, p.y, 0, bottom);
  g.addColorStop(0, _SHP_WELL_BG2);
  g.addColorStop(1, _SHP_WELL_BG);
  ctx.fillStyle = g;
  ctx.fillRect(p.x, p.y, p.w, p.h);

  ctx.beginPath();
  ctx.rect(p.x, p.y, p.w, p.h);
  ctx.clip();

  ctx.lineWidth = 1;

  for (i = 0; i < _SHP_GRID_F.length; i++) {
    v = _SHP_GRID_F[i];
    x = Math.round(xOfF(v)) + 0.5;
    if (x < p.x - 1 || x > right + 1) continue;
    ctx.strokeStyle = _SHP_LABEL_TEXT[v] ? 'rgba(255,255,255,.10)' : 'rgba(255,255,255,.045)';
    ctx.beginPath(); ctx.moveTo(x, p.y); ctx.lineTo(x, bottom); ctx.stroke();
  }

  for (i = 0; i < _SHP_DB_TICKS.length; i++) {
    v = _SHP_DB_TICKS[i];
    y = Math.round(yOfDb(v)) + 0.5;
    if (y < p.y - 1 || y > bottom + 1) continue;
    ctx.strokeStyle = (v === 0) ? 'rgba(255,255,255,.16)' : 'rgba(255,255,255,.055)';
    ctx.beginPath(); ctx.moveTo(p.x, y); ctx.lineTo(right, y); ctx.stroke();
  }

  /* hairline lip, so the panel reads as sunk into the faceplate */
  ctx.strokeStyle = _SHP_WELL_LINE;
  ctx.strokeRect(Math.round(p.x) + 0.5, Math.round(p.y) + 0.5,
                 Math.round(p.w) - 1, Math.round(p.h) - 1);

  ctx.restore();
}


/* ---- axes: EQ gain left, analyser level right, frequency below ---------- */
function drawAxes(ctx, p) {
  ctx.save();
  p = _shpRect(p);
  if (p.w <= 0 || p.h <= 0) { ctx.restore(); return; }

  var bottom = p.y + p.h, right = p.x + p.w, i, v, y, x;

  ctx.font = _SHP_FONT;
  ctx.fillStyle = _SHP_ON_DARK2;

  /* left — EQ gain in dB */
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (i = 0; i < _SHP_DB_TICKS.length; i++) {
    v = _SHP_DB_TICKS[i];
    y = yOfDb(v);
    if (y < p.y - 1 || y > bottom + 1) continue;
    ctx.fillText((v > 0 ? '+' : '') + v, p.x - 9, y);
  }
  ctx.textBaseline = 'top';
  ctx.fillText('dB', p.x - 9, 2);

  /* right — the fine ruler */
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  var fine = _shpFineTicks();
  for (i = 0; i < fine.length; i++) {
    v = fine[i];
    y = yOfFs(v);
    if (y < p.y - 1 || y > bottom + 1) continue;
    v = Math.round(v * 10) / 10;
    ctx.fillText((v > 0 ? '+' : '') + v, right + 9, y);
  }

  /* bottom — frequency */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (i = 0; i < _SHP_LABEL_F.length; i++) {
    v = _SHP_LABEL_F[i];
    x = xOfF(v);
    if (x < p.x - 6 || x > right + 6) continue;
    ctx.fillText(_SHP_LABEL_TEXT[v], x, bottom + 8);
  }

  ctx.restore();
}


/* ---- spectrum: behind everything, always neutral grey ------------------- */
function drawSpectrum(ctx, p) {
  ctx.save();
  p = _shpRect(p);
  if (p.w <= 0 || p.h <= 0 ||
      typeof specDisp === 'undefined' || !specDisp || !specDisp.length ||
      typeof binF === 'undefined' || !binF || !binF.length) {
    ctx.restore(); return;
  }

  var floorY = p.y + p.h;

  ctx.beginPath();
  ctx.rect(p.x, p.y, p.w, p.h);
  ctx.clip();

  /* body */
  ctx.beginPath();
  var span = _shpSpecPath(ctx, p, specDisp);
  if (!span) { ctx.restore(); return; }
  ctx.lineTo(span.last, floorY + 2);
  ctx.lineTo(span.first, floorY + 2);
  ctx.closePath();

  var g = ctx.createLinearGradient(0, p.y, 0, floorY);
  g.addColorStop(0, 'rgba(200,210,222,.16)');
  g.addColorStop(1, 'rgba(200,210,222,.03)');
  ctx.fillStyle = g;
  ctx.fill();

  /* contour — redrawn open so the closing edges never get stroked */
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(210,218,228,.45)';
  ctx.beginPath();
  _shpSpecPath(ctx, p, specDisp);
  ctx.stroke();

  /* peak hold */
  if (typeof specPeak !== 'undefined' && specPeak && specPeak.length) {
    ctx.strokeStyle = 'rgba(255,255,255,.14)';
    ctx.beginPath();
    if (_shpSpecPath(ctx, p, specPeak)) ctx.stroke();
  }

  ctx.restore();
}


/* ---- the curve ---------------------------------------------------------- */

/* Horizontal gradient carrying each band's hue at that band's frequency, so
   the curve shifts colour along its length toward whichever band is local.
   addColorStop throws on an out-of-range offset and misbehaves out of order,
   so offsets are clamped and sorted before any of them is added. */
function _shpCurveGradient(ctx, p, bands) {
  var g = ctx.createLinearGradient(p.x, 0, p.x + p.w, 0);
  var stops = [], i, b;

  for (i = 0; i < bands.length; i++) {
    b = bands[i];
    if (!b || b.on === false) continue;
    stops.push({ o: _shpClamp((xOfF(b.freq) - p.x) / (p.w || 1), 0, 1), c: bandHue(b, i) });
  }
  /* every band muted — keep a hue rather than an invisible curve */
  if (!stops.length) {
    for (i = 0; i < bands.length; i++) {
      b = bands[i];
      if (!b) continue;
      stops.push({ o: _shpClamp((xOfF(b.freq) - p.x) / (p.w || 1), 0, 1), c: bandHue(b, i) });
    }
  }
  if (!stops.length) {
    g.addColorStop(0, _SHP_CYAN);
    g.addColorStop(1, _SHP_CYAN);
    return g;
  }

  stops.sort(function (a, c) { return a.o - c.o; });

  /* anchor both ends so the curve never fades out at the edges */
  g.addColorStop(0, stops[0].c);
  for (i = 0; i < stops.length; i++) {
    if (stops[i].o > 0 && stops[i].o < 1) g.addColorStop(stops[i].o, stops[i].c);
  }
  g.addColorStop(1, stops[stops.length - 1].c);
  return g;
}

/* violet wash between the bands at rest and the bands pushed to their limit */
function _shpDynamicRegion(ctx, p, bands) {
  var any = false, i;
  for (i = 0; i < bands.length; i++) {
    if (bands[i] && bands[i].dyn && bands[i].dyn.on && bands[i].on !== false) { any = true; break; }
  }
  if (!any) return;
  if (typeof respStatic === 'undefined' || typeof respRange === 'undefined') return;
  if (!respStatic || !respRange || respStatic.length < 2 || respRange.length < 2) return;

  var lo = p.y - 200, hi = p.y + p.h + 200;
  var n = respStatic.length, m = respRange.length;

  ctx.beginPath();
  for (i = 0; i < n; i++) {
    var px = p.x + (i / (n - 1)) * p.w;
    var py = _shpClamp(yOfDb(respStatic[i]), lo, hi);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  for (i = m - 1; i >= 0; i--) {
    ctx.lineTo(p.x + (i / (m - 1)) * p.w, _shpClamp(yOfDb(respRange[i]), lo, hi));
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(155,123,240,.13)';
  ctx.fill();
}

function drawResponse(ctx, p, bands) {
  ctx.save();
  p = _shpRect(p);
  if (p.w <= 0 || p.h <= 0 ||
      typeof respLive === 'undefined' || !respLive || respLive.length === 0) {
    ctx.restore(); return;
  }

  bands = _shpBands(bands);

  ctx.beginPath();
  ctx.rect(p.x, p.y, p.w, p.h);
  ctx.clip();

  var grad = _shpCurveGradient(ctx, p, bands);
  var zero = yOfDb(0);

  /* 2 — fill, curve closed down onto the 0 dB line */
  ctx.beginPath();
  if (!_shpRespPath(ctx, p, respLive)) { ctx.restore(); return; }
  ctx.lineTo(p.x + p.w, zero);
  ctx.lineTo(p.x, zero);
  ctx.closePath();

  ctx.globalAlpha = 0.20;
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.globalAlpha = 1;

  /* second pass inside that same region: a vertical wash that fades out
     toward the top and bottom of the well, so a deep excursion tints the
     ground instead of flooding it with a slab of colour */
  ctx.save();
  ctx.beginPath();
  _shpRespPath(ctx, p, respLive);
  ctx.lineTo(p.x + p.w, zero);
  ctx.lineTo(p.x, zero);
  ctx.closePath();
  ctx.clip();
  var vg = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
  var zt = _shpClamp((zero - p.y) / p.h, 0.02, 0.98);
  vg.addColorStop(0, 'rgba(210,222,238,0)');
  vg.addColorStop(zt, 'rgba(210,222,238,.07)');
  vg.addColorStop(1, 'rgba(210,222,238,0)');
  ctx.fillStyle = vg;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.restore();

  /* 5 — dynamic range region. Drawn here rather than last so the violet
     wash stays under the curve: over the core stroke it would veil it. */
  _shpDynamicRegion(ctx, p, bands);

  /* 3 — glow, two widening strokes rather than a shadow blur */
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = grad;
  ctx.shadowBlur = 0;

  ctx.globalAlpha = 0.18;
  ctx.lineWidth = 6;
  ctx.beginPath(); _shpRespPath(ctx, p, respLive); ctx.stroke();

  ctx.globalAlpha = 0.30;
  ctx.lineWidth = 3;
  ctx.beginPath(); _shpRespPath(ctx, p, respLive); ctx.stroke();

  /* 4 — core */
  ctx.globalAlpha = 1;
  ctx.lineWidth = 2.25;
  ctx.beginPath(); _shpRespPath(ctx, p, respLive); ctx.stroke();

  ctx.restore();
}


/* ---- nodes: small, crisp, glowing rings --------------------------------- */
function drawNodes(ctx, p, bands, selectedIndex, hoverIndex) {
  ctx.save();
  p = _shpRect(p);
  if (p.w <= 0 || p.h <= 0) { ctx.restore(); return; }

  bands = _shpBands(bands);
  var sel = _shpSelected(selectedIndex);
  var hov = (typeof hoverIndex === 'number') ? hoverIndex : -1;

  ctx.beginPath();
  ctx.rect(p.x, p.y, p.w, p.h);
  ctx.clip();

  for (var i = 0; i < bands.length; i++) {
    var band = bands[i];
    if (!band) continue;

    var x = xOfF(band.freq);
    if (x < p.x - 24 || x > p.x + p.w + 24) continue;
    var y = yOfDb(_shpBandGain(band));
    if (y < p.y - 40 || y > p.y + p.h + 40) continue;

    var hue = bandHue(band, i, sel);
    var off = (band.on === false);

    /* outer glow — skipped on a bypassed band */
    if (!off) {
      var rg = ctx.createRadialGradient(x, y, 0, x, y, 16);
      rg.addColorStop(0, _shpRgba(hue, 0.28));
      rg.addColorStop(0.55, _shpRgba(hue, 0.12));
      rg.addColorStop(1, _shpRgba(hue, 0));
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(x, y, 16, 0, _SHP_TAU); ctx.fill();
    }

    /* dark core */
    ctx.fillStyle = '#12151A';
    ctx.beginPath(); ctx.arc(x, y, 7, 0, _SHP_TAU); ctx.fill();

    /* ring */
    ctx.globalAlpha = off ? 0.35 : 1;
    ctx.strokeStyle = hue;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, 7, 0, _SHP_TAU); ctx.stroke();
    ctx.globalAlpha = 1;

    /* hover halo — a hairline, never a fatter node */
    if (i === hov && i !== sel) {
      ctx.globalAlpha = 0.40;
      ctx.strokeStyle = hue;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, 11, 0, _SHP_TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* selection ring */
    if (i === sel) {
      ctx.globalAlpha = 0.60;
      ctx.strokeStyle = _SHP_AMBER;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, 12, 0, _SHP_TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  ctx.restore();
}


/* ---- hover guide -------------------------------------------------------- */
function drawHoverGuide(ctx, p, mouseX, freq, db) {
  ctx.save();
  p = _shpRect(p);
  if (p.w <= 0 || p.h <= 0 || typeof mouseX !== 'number' || !isFinite(mouseX) ||
      mouseX < p.x - 2 || mouseX > p.x + p.w + 2) {
    ctx.restore(); return;
  }

  var right = p.x + p.w;
  var gx = Math.round(_shpClamp(mouseX, p.x, right)) + 0.5;

  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,255,255,.18)';
  ctx.setLineDash([3, 4]);
  ctx.beginPath();
  ctx.moveTo(gx, p.y);
  ctx.lineTo(gx, p.y + p.h);
  ctx.stroke();
  ctx.setLineDash([]);

  var label = _shpFmtHz(freq) + '   ' + _shpFmtDb(db);

  ctx.font = _SHP_FONT;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  var padX = 7, boxH = 19;
  var boxW = Math.round(ctx.measureText(label).width) + padX * 2;
  var boxY = Math.round(p.y + 8) + 0.5;
  var boxX = Math.round(gx + 10) + 0.5;

  /* flip to the left of the cursor rather than run off the well */
  if (boxX + boxW > right - 4) boxX = Math.round(gx - 10 - boxW) + 0.5;
  boxX = Math.max(Math.round(p.x + 4) + 0.5, boxX);

  ctx.beginPath();
  _shpRoundRectPath(ctx, boxX, boxY, boxW, boxH, 4);
  ctx.fillStyle = 'rgba(10,12,16,.92)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = _SHP_ON_DARK;
  ctx.fillText(label, boxX + padX, boxY + boxH / 2 + 0.5);

  ctx.restore();
}


/* ---- POST spectrum: PRE multiplied by the computed response ------------
   Not a second synthetic curve — the same bins, offset by the response the
   EQ actually produces at that frequency, so it moves when a node moves. */
function drawSpectrumPost(ctx, p) {
  ctx.save();
  p = _shpRect(p);
  if (p.w <= 0 || p.h <= 0 || typeof specDisp === 'undefined' ||
      !specDisp || !specDisp.length) { ctx.restore(); return; }

  ctx.beginPath();
  ctx.rect(p.x, p.y, p.w, p.h);
  ctx.clip();

  var n = Math.min(NBINS, specDisp.length, binF.length);
  var lo = p.y - 40, hi = p.y + p.h + 40;
  var started = false;

  ctx.beginPath();
  for (var i = 0; i < n; i++) {
    var f = binF[i];
    if (f > _SHP_NYQ_DRAW) break;
    var x = xOfF(f);
    var y = _shpClamp(yOfLevel(specDisp[i] + respAtF(f)), lo, hi);
    if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
  }
  if (started) {
    ctx.lineWidth = 1.25;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(155,123,240,.80)';
    ctx.stroke();
  }
  ctx.restore();
}

</script>

<script>
(function(){
  "use strict";

  var ARC_START = 135;          /* 7:30 */
  var ARC_SWEEP = 270;          /* to 4:30, clockwise through 12 o'clock */
  var DRAG_TRAVEL = 190;        /* px of vertical travel for the full range */
  var FINE = 0.22;
  var uid = 0;

  var SIZES = {
    md:{ body:52, box:70, rArc:28.2, tickIn:31.0, tickOut:34.0, arcW:2.5, tickW:1 },
    lg:{ body:72, box:94, rArc:38.6, tickIn:42.0, tickOut:45.6, arcW:3.2, tickW:1 }
  };

  var clamp = function(v,a,b){ return v < a ? a : v > b ? b : v; };

  function polar(c, r, deg){
    var t = deg * Math.PI / 180;
    return [ c + r * Math.cos(t), c + r * Math.sin(t) ];
  }

  function arcPath(c, r, a0, a1){
    if (Math.abs(a1 - a0) < 0.4) a1 = a0 + 0.4;   /* keep a visible LED dot at the origin */
    var p0 = polar(c, r, a0), p1 = polar(c, r, a1);
    var large = Math.abs(a1 - a0) > 180 ? 1 : 0;
    var sweep = a1 > a0 ? 1 : 0;
    return "M" + p0[0].toFixed(2) + " " + p0[1].toFixed(2) +
           "A" + r + " " + r + " 0 " + large + " " + sweep + " " +
           p1[0].toFixed(2) + " " + p1[1].toFixed(2);
  }

  /* ------------------------------------------------------------------ knob */

  function MetalKnob(opts){
    opts = opts || {};

    this.label    = opts.label != null ? opts.label : "";
    this.unit     = opts.unit != null ? opts.unit : "";
    this.min      = opts.min != null ? +opts.min : 0;
    this.max      = opts.max != null ? +opts.max : 1;
    this.curve    = opts.curve || "lin";
    this.bipolar  = !!opts.bipolar;
    this.accent   = (opts.accent === "amber" || opts.accent === "violet") ? opts.accent : "cyan";
    this.size     = opts.size === "lg" ? "lg" : "md";
    this.onChange = typeof opts.onChange === "function" ? opts.onChange : null;
    this.format   = typeof opts.format === "function" ? opts.format : null;

    if (this.curve === "log" && !(this.min > 0 && this.max > 0)) this.curve = "lin";

    var P = this.P = SIZES[this.size];
    this._value = clamp(opts.value != null ? +opts.value : this.min, this.min, this.max);
    this._initial = this._value;

    /* ---- DOM ---- */
    var el = this.el = document.createElement("div");
    el.className = "sh-knob sh-knob--" + this.size + " sh-knob--" + this.accent;

    var gid = "sh-glow-" + (++uid);
    var c = P.box / 2;

    var ticks = "";
    for (var i = 0; i < 11; i++){
      var a = ARC_START + ARC_SWEEP * (i / 10);
      var p0 = polar(c, P.tickIn, a), p1 = polar(c, P.tickOut, a);
      ticks += '<line x1="' + p0[0].toFixed(2) + '" y1="' + p0[1].toFixed(2) +
               '" x2="' + p1[0].toFixed(2) + '" y2="' + p1[1].toFixed(2) +
               '" stroke-width="' + P.tickW + '"/>';
    }

    var dial = this.dial = document.createElement("div");
    dial.className = "sh-knob-dial";
    dial.setAttribute("role", "slider");
    dial.setAttribute("tabindex", "0");
    dial.setAttribute("aria-orientation", "vertical");
    dial.setAttribute("aria-valuemin", String(this.min));
    dial.setAttribute("aria-valuemax", String(this.max));
    if (this.label) dial.setAttribute("aria-label", this.label);

    dial.innerHTML =
      '<svg class="sh-knob-svg" width="' + P.box + '" height="' + P.box +
        '" viewBox="0 0 ' + P.box + ' ' + P.box + '" aria-hidden="true" focusable="false"' +
        ' shape-rendering="geometricPrecision">' +
        '<defs><filter id="' + gid + '" filterUnits="userSpaceOnUse" x="-10" y="-10" width="' +
          (P.box + 20) + '" height="' + (P.box + 20) + '">' +
          '<feGaussianBlur stdDeviation="' + (P.arcW * 0.8).toFixed(2) + '"/>' +
        '</filter></defs>' +
        '<g class="sh-knob-ticks">' + ticks + '</g>' +
        '<path class="sh-knob-arc-glow" stroke-width="' + (P.arcW * 2.6).toFixed(2) + '"/>' +
        '<path class="sh-knob-arc-bloom" filter="url(#' + gid + ')" stroke-width="' + (P.arcW * 1.6).toFixed(2) + '"/>' +
        '<path class="sh-knob-arc" stroke-width="' + P.arcW + '"/>' +
      '</svg>' +
      '<div class="sh-knob-halo"></div>' +
      '<div class="sh-knob-body">' +
        '<i class="sh-knob-lay"></i>' +
        '<div class="sh-knob-rot"><i class="sh-knob-ind"></i></div>' +
      '</div>';

    el.appendChild(dial);

    this.arc   = dial.querySelector(".sh-knob-arc");
    this.bloom = dial.querySelector(".sh-knob-arc-bloom");
    this.glow  = dial.querySelector(".sh-knob-arc-glow");
    this.rot   = dial.querySelector(".sh-knob-rot");

    if (this.size === "lg" && !opts.readout){
      var scale = document.createElement("div");
      scale.className = "sh-knob-scale";
      var marks = opts.scale || [ this._scaleText(this.min),
                                  this._scaleText((this.min + this.max) / 2),
                                  this._scaleText(this.max) ];
      for (var m = 0; m < marks.length; m++){
        var s = document.createElement("span");
        s.textContent = marks[m];
        scale.appendChild(s);
      }
      el.appendChild(scale);
      this.valueEl = null;
    } else {
      if (this.label){
        var lab = document.createElement("div");
        lab.className = "sh-knob-label";
        lab.textContent = this.label;
        el.appendChild(lab);
      }
      var val = this.valueEl = document.createElement("div");
      val.className = "sh-knob-value";
      el.appendChild(val);
    }

    this._bind();
    this._paint();
  }

  MetalKnob.prototype._scaleText = function(v){
    var r = Math.round(v * 10) / 10;
    var s = (Math.abs(r % 1) < 1e-9) ? String(Math.round(r)) : r.toFixed(1);
    return (this.bipolar && r > 0) ? "+" + s : s;
  };

  /* value <-> normalised 0..1 ------------------------------------------- */

  MetalKnob.prototype._toNorm = function(v){
    var min = this.min, max = this.max;
    if (max === min) return 0;
    if (this.curve === "log") return Math.log(v / min) / Math.log(max / min);
    var t = (v - min) / (max - min);
    if (this.curve === "skew") t = Math.pow(clamp(t, 0, 1), 1 / 2.6);
    return t;
  };

  MetalKnob.prototype._fromNorm = function(t){
    t = clamp(t, 0, 1);
    var min = this.min, max = this.max;
    if (this.curve === "log") return min * Math.pow(max / min, t);
    if (this.curve === "skew") return min + (max - min) * Math.pow(t, 2.6);
    return min + (max - min) * t;
  };

  MetalKnob.prototype._text = function(){
    var v = this._value;
    if (this.format) return this.format(v);
    var a = Math.abs(v);
    var s = a >= 1000 ? v.toFixed(0) : a >= 100 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : v.toFixed(2);
    if (this.bipolar && v > 0) s = "+" + s;
    if (!this.unit) return s;
    return (this.unit === "%" || this.unit === "°" || this.unit === ":1") ? s + this.unit : s + " " + this.unit;
  };

  /* paint ---------------------------------------------------------------- */

  MetalKnob.prototype._paint = function(){
    var P = this.P, c = P.box / 2;
    var t = clamp(this._toNorm(this._value), 0, 1);
    var a = ARC_START + ARC_SWEEP * t;
    var a0 = this.bipolar ? (ARC_START + ARC_SWEEP / 2) : ARC_START;
    var d = arcPath(c, P.rArc, a0, a);

    this.arc.setAttribute("d", d);
    this.bloom.setAttribute("d", d);
    this.glow.setAttribute("d", d);
    this.rot.style.transform = "rotate(" + (a - 270).toFixed(2) + "deg)";

    var txt = this._text();
    if (this.valueEl) this.valueEl.textContent = txt;
    this.dial.setAttribute("aria-valuenow", String(Math.round(this._value * 1e4) / 1e4));
    this.dial.setAttribute("aria-valuetext", txt);
  };

  MetalKnob.prototype._apply = function(v, notify){
    v = clamp(+v, Math.min(this.min, this.max), Math.max(this.min, this.max));
    if (!isFinite(v)) return;
    var changed = v !== this._value;
    this._value = v;
    this._paint();
    if (changed && notify !== false && this.onChange) this.onChange(this._value);
  };

  MetalKnob.prototype.set = function(v, notify){ this._apply(v, notify); return this; };

  Object.defineProperty(MetalKnob.prototype, "value", {
    get:function(){ return this._value; },
    set:function(v){ this._apply(v, true); }
  });

  /* interaction ----------------------------------------------------------- */

  MetalKnob.prototype._nudge = function(dNorm){
    this._apply(this._fromNorm(clamp(this._toNorm(this._value) + dNorm, 0, 1)), true);
  };

  MetalKnob.prototype._bind = function(){
    var self = this, dial = this.dial, drag = null;
    var tap = { t:0, x:0, y:0 };

    dial.addEventListener("pointerdown", function(e){
      if (e.pointerType === "mouse" && e.button !== 0) return;

      /* double-click / double-tap resets; done here as well as on dblclick,
         because preventDefault() below can suppress compatibility events. */
      var now = Date.now();
      if (now - tap.t < 320 && Math.abs(e.clientX - tap.x) < 6 && Math.abs(e.clientY - tap.y) < 6){
        tap.t = 0;
        self._apply(self._initial, true);
      } else {
        tap = { t:now, x:e.clientX, y:e.clientY };
      }

      drag = { id:e.pointerId, lastY:e.clientY, base:clamp(self._toNorm(self._value), 0, 1), acc:0 };
      try { dial.setPointerCapture(e.pointerId); } catch(_){}
      self.el.classList.add("sh-knob--active");
      if (document.activeElement !== dial) dial.focus({ preventScroll:true });
      e.preventDefault();
    });

    dial.addEventListener("pointermove", function(e){
      if (!drag || e.pointerId !== drag.id) return;
      var dy = drag.lastY - e.clientY;
      drag.lastY = e.clientY;
      drag.acc += (dy / DRAG_TRAVEL) * (e.shiftKey ? FINE : 1);
      self._apply(self._fromNorm(drag.base + drag.acc), true);
      e.preventDefault();
    });

    function end(e){
      if (!drag || (e && e.pointerId !== drag.id)) return;
      try { dial.releasePointerCapture(drag.id); } catch(_){}
      drag = null;
      self.el.classList.remove("sh-knob--active");
    }
    dial.addEventListener("pointerup", end);
    dial.addEventListener("pointercancel", end);
    dial.addEventListener("lostpointercapture", end);

    this._onWheel = function(e){
      e.preventDefault();
      var dir = (e.deltaY || e.detail || -e.wheelDelta) > 0 ? -1 : 1;
      self._nudge(dir * (e.shiftKey ? 0.02 * FINE : 0.02));
    };
    dial.addEventListener("wheel", this._onWheel, { passive:false });

    dial.addEventListener("dblclick", function(e){
      e.preventDefault();
      self._apply(self._initial, true);
    });

    dial.addEventListener("keydown", function(e){
      var step = e.shiftKey ? 0.02 * FINE : 0.02;
      var k = e.key;
      if (k === "ArrowUp" || k === "ArrowRight")      self._nudge(step);
      else if (k === "ArrowDown" || k === "ArrowLeft") self._nudge(-step);
      else if (k === "PageUp")   self._nudge(0.1);
      else if (k === "PageDown") self._nudge(-0.1);
      else if (k === "Home")     self._apply(self.min, true);
      else if (k === "End")      self._apply(self.max, true);
      else return;
      e.preventDefault();
    });
  };

  MetalKnob.prototype.destroy = function(){
    this.dial.removeEventListener("wheel", this._onWheel);
    if (this.el.parentNode) this.el.parentNode.removeChild(this.el);
  };

  /* ------------------------------------------------- filter-shape buttons */

  var GLYPHS = {
    lowshelf : "M1.5 4.6H5.4C8.4 4.6 8.4 11.4 11.4 11.4H20.5",
    bell     : "M1.5 11.6H5.6C8.3 11.6 8.1 4.2 10.9 4.2C13.7 4.2 13.5 11.6 16.2 11.6H20.5",
    highshelf: "M1.5 11.4H10.6C13.6 11.4 13.6 4.6 16.6 4.6H20.5",
    cut      : "M1.5 14.2H7.6L11.6 3.8H20.5"
  };
  var GLYPH_ORDER = ["lowshelf", "bell", "highshelf", "cut"];
  var GLYPH_TITLE = { lowshelf:"Low shelf", bell:"Bell", highshelf:"High shelf", cut:"Cut" };

  function shapeIcon(name){
    return '<svg viewBox="0 0 22 16" aria-hidden="true" focusable="false"><path d="' +
           (GLYPHS[name] || GLYPHS.bell) + '"/></svg>';
  }

  function makeShapeButtons(opts){
    opts = opts || {};
    var shapes = opts.shapes || GLYPH_ORDER;
    var idx = opts.value != null ? opts.value : (opts.active != null ? opts.active : 0);

    var el = document.createElement("div");
    el.className = "sh-shapes";
    el.setAttribute("role", "group");
    if (opts.label) el.setAttribute("aria-label", opts.label);

    var btns = shapes.map(function(name, i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "sh-shape-btn";
      b.innerHTML = shapeIcon(name);
      b.title = GLYPH_TITLE[name] || name;
      b.setAttribute("aria-label", GLYPH_TITLE[name] || name);
      b.addEventListener("click", function(){ api.set(i, true); });
      el.appendChild(b);
      return b;
    });

    var api = {
      el:el,
      value:idx,
      shapes:shapes,
      set:function(i, notify){
        i = clamp(i | 0, 0, btns.length - 1);
        var changed = i !== api.value;
        api.value = i;
        for (var n = 0; n < btns.length; n++){
          var on = n === i;
          btns[n].classList.toggle("sh-on", on);
          btns[n].setAttribute("aria-pressed", on ? "true" : "false");
        }
        if (changed && notify && typeof opts.onChange === "function") opts.onChange(i, shapes[i]);
        return api;
      }
    };
    el.__ctl = api;
    return api.set(idx, false);
  }

  /* ---------------------------------------------------------- pill toggle */

  function makePill(opts){
    opts = opts || {};
    var el = document.createElement("button");
    el.type = "button";
    el.className = "sh-pill";
    el.innerHTML = '<span class="sh-pill-dot"></span><span class="sh-pill-txt"></span>';
    el.querySelector(".sh-pill-txt").textContent = opts.label || "";

    var api = {
      el:el,
      value:!!opts.on,
      set:function(on, notify){
        on = !!on;
        var changed = on !== api.value;
        api.value = on;
        el.classList.toggle("sh-on", on);
        el.setAttribute("aria-pressed", on ? "true" : "false");
        if (changed && notify && typeof opts.onChange === "function") opts.onChange(on);
        return api;
      },
      toggle:function(){ return api.set(!api.value, true); }
    };
    el.addEventListener("click", function(){ api.toggle(); });
    el.__ctl = api;
    return api.set(!!opts.on, false);
  }

  /* ----------------------------------------------------- segmented select */

  function makeSegmented(opts){
    opts = opts || {};
    var options = (opts.options || []).map(function(o){
      return (typeof o === "string") ? { label:o, value:o } : { label:o.label, value:o.value != null ? o.value : o.label };
    });
    var idx = opts.value != null ? opts.value : (opts.active != null ? opts.active : 0);
    if (typeof idx !== "number"){
      var found = options.findIndex(function(o){ return o.value === idx; });
      idx = found < 0 ? 0 : found;
    }

    var el = document.createElement("div");
    el.className = "sh-seg";
    el.setAttribute("role", "group");
    if (opts.label) el.setAttribute("aria-label", opts.label);

    var btns = options.map(function(o, i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "sh-seg-btn";
      b.textContent = o.label;
      b.addEventListener("click", function(){ api.set(i, true); });
      el.appendChild(b);
      return b;
    });

    var api = {
      el:el,
      value:idx,
      options:options,
      set:function(i, notify){
        i = clamp(i | 0, 0, btns.length - 1);
        var changed = i !== api.value;
        api.value = i;
        for (var n = 0; n < btns.length; n++){
          var on = n === i;
          btns[n].classList.toggle("sh-on", on);
          btns[n].setAttribute("aria-pressed", on ? "true" : "false");
        }
        if (changed && notify && typeof opts.onChange === "function") opts.onChange(i, options[i].value);
        return api;
      }
    };
    el.__ctl = api;
    return api.set(idx, false);
  }

  window.MetalKnob = MetalKnob;
  window.makeShapeButtons = makeShapeButtons;
  window.makePill = makePill;
  window.makeSegmented = makeSegmented;
})();
</script>

<script>
/* ==================================================================
   SHAPE — wiring
   Binds the control components to engine state. Every readout on screen
   is derived from state; nothing is hard-coded markup.
   ================================================================== */
"use strict";

var KNOBS = {};
var SEGS = {};

/* ---------- knob definitions ----------------------------------- */
var KNOB_DEFS = {
  frequency: {
    label: "Frequency", min: 20, max: 20000, curve: "log", accent: "cyan", def: 1000,
    get: function () { return selBand().freq; },
    set: function (v) { selBand().freq = v; },
    format: function (v) { return fmtFreq(v); }
  },
  gain: {
    label: "Gain", min: -24, max: 24, curve: "lin", bipolar: true, accent: "amber", def: 0,
    get: function () { return selBand().gain; },
    set: function (v) { selBand().gain = v; },
    format: function (v) { return fmtDb(v); }
  },
  q: {
    label: "Q", min: 0.1, max: 100, curve: "log", accent: "cyan", def: 1,
    get: function () { return selBand().q; },
    set: function (v) { selBand().q = v; },
    format: function (v) { return v < 10 ? v.toFixed(2) : v.toFixed(1); }
  },
  threshold: {
    label: "Threshold", min: -60, max: 0, curve: "lin", accent: "violet", def: -24,
    get: function () { return selBand().dyn.threshold; },
    set: function (v) { selBand().dyn.threshold = v; },
    format: function (v) { return v.toFixed(1) + " dB"; }
  },
  range: {
    label: "Range", min: -18, max: 18, curve: "lin", bipolar: true, accent: "violet", def: -6,
    get: function () { return selBand().dyn.range; },
    set: function (v) { selBand().dyn.range = v; },
    format: function (v) { return fmtDb(v); }
  },
  attack: {
    label: "Attack", min: 0.1, max: 500, curve: "log", accent: "violet", def: 10,
    get: function () { return selBand().dyn.attack; },
    set: function (v) { selBand().dyn.attack = v; },
    format: function (v) { return (v < 10 ? v.toFixed(1) : v.toFixed(0)) + " ms"; }
  },
  release: {
    label: "Release", min: 5, max: 5000, curve: "log", accent: "violet", def: 120,
    get: function () { return selBand().dyn.release; },
    set: function (v) { selBand().dyn.release = v; },
    format: function (v) { return v < 1000 ? v.toFixed(0) + " ms" : (v / 1000).toFixed(2) + " s"; }
  },
  input: {
    label: "Input", min: -24, max: 24, curve: "lin", bipolar: true, accent: "cyan", size: "lg", def: 0,
    get: function () { return ST.input; },
    set: function (v) { ST.input = v; },
    format: function (v) { return fmtDb(v); }
  },
  output: {
    label: "Output", min: -24, max: 24, curve: "lin", bipolar: true, accent: "cyan", size: "lg", def: 0,
    get: function () { return ST.output; },
    set: function (v) { ST.output = v; },
    format: function (v) { return fmtDb(v); }
  }
};

/* ---------- small helpers -------------------------------------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function press(el, on) { if (el) el.setAttribute("aria-pressed", on ? "true" : "false"); }

/* Build a segmented control into a mount. Emits markup that satisfies
   either `.sh-seg button` or `.sh-seg-btn` styling conventions. */
var SHAPE_MAP = ["lowshelf", "bell", "highshelf", "lowcut"];

function buildSegmented(mount, options, getter, setter) {
  var values = options.map(function (o) { return o.v; });
  var api = makeSegmented({
    options: options.map(function (o) { return { label: o.label, value: o.v }; }),
    value: Math.max(0, values.indexOf(getter())),
    onChange: function (i, v) { commit(function () { setter(v); }); syncAll(); }
  });
  mount.appendChild(api.el);
  api._sync = function () {
    var i = values.indexOf(getter());
    if (i >= 0) api.set(i, false);
  };
  return api;
}

/* ---------- build ---------------------------------------------- */
function buildControls() {
  /* --- knobs --- */
  $$(".sh-knobmount").forEach(function (mount) {
    var key = mount.dataset.knob;
    var d = KNOB_DEFS[key];
    if (!d) return;
    var k = new MetalKnob({
      label: d.label,
      min: d.min, max: d.max,
      value: d.get(),
      curve: d.curve || "lin",
      bipolar: !!d.bipolar,
      accent: d.accent,
      size: mount.dataset.size || d.size || "md",
      format: d.format,
      onChange: function (v) { d.set(v); syncReadouts(); }
    });
    /* group a whole drag into one undo entry */
    k.el.addEventListener("pointerdown", beginGesture);
    k.el.addEventListener("pointerup", endGesture);
    k.el.addEventListener("dblclick", function () {
      commit(function () { d.set(d.def); });
      syncAll();
    });
    mount.appendChild(k.el);
    KNOBS[key] = k;
  });

  /* --- DYNAMIC pill --- */
  $$(".sh-pillmount").forEach(function (mount) {
    var api = makePill({
      label: "Dynamic",
      on: selBand().dyn.on,
      onChange: function (on) {
        commit(function () {
          var sb = selBand();
          sb.dyn.on = on;
          if (!on) sb.dyn.cur = 0;
        });
        syncAll();
      }
    });
    mount.appendChild(api.el);
    KNOBS._dynPill = api;
  });

  /* --- segmented groups --- */
  var segPhase = $('.sh-segmount[data-seg="phase"]');
  if (segPhase) SEGS.phase = buildSegmented(segPhase,
    [{ v: "zero", label: "Zero" }, { v: "natural", label: "Natural" }, { v: "linear", label: "Linear" }],
    function () { return ST.phase; }, function (v) { ST.phase = v; });

  var segScale = $('.sh-segmount[data-seg="scale"]');
  if (segScale) SEGS.scale = buildSegmented(segScale,
    [{ v: "12", label: "12 dB" }, { v: "6", label: "6 dB" }],
    function () { return String(ST.fineScale); }, function (v) { ST.fineScale = +v; });

  var segMode = $('.sh-segmount[data-seg="mode"]');
  if (segMode) SEGS.mode = buildSegmented(segMode,
    [{ v: "clean", label: "Clean" }, { v: "analog", label: "Analog" }, { v: "precision", label: "Precision" }],
    function () { return ST.mode; }, function (v) { ST.mode = v; });

  /* --- filter shape buttons --- */
  var shapeRow = $(".sh-shapebtns");
  if (shapeRow) {
    var shapeApi = makeShapeButtons({
      label: "Filter shape",
      value: Math.max(0, SHAPE_MAP.indexOf(selBand().type)),
      onChange: function (i) {
        commit(function () {
          var sb = selBand();
          sb.type = SHAPE_MAP[i] || "bell";
          if (!TYPES[sb.type].gain) sb.gain = 0;
        });
        syncAll();
      }
    });
    shapeRow.appendChild(shapeApi.el);
    KNOBS._shapes = shapeApi;
  }

  /* --- type dropdown --- */
  var sel = $(".sh-select");
  if (sel) {
    sel.innerHTML = "";
    Object.keys(TYPES).forEach(function (k) {
      var o = document.createElement("option");
      o.value = k; o.textContent = TYPES[k].label;
      sel.appendChild(o);
    });
    sel.addEventListener("change", function () {
      commit(function () {
        var sb = selBand();
        sb.type = sel.value;
        if (!TYPES[sb.type].gain) sb.gain = 0;
        if (sb.type === "notch" && sb.q < 4) sb.q = 12;
      });
      syncAll();
    });
  }

  /* --- band prev / next --- */
  $$("[data-band-nav]").forEach(function (b) {
    b.addEventListener("click", function () {
      var d = b.dataset.bandNav === "next" ? 1 : -1;
      ST.selected = (ST.selected + d + ST.bands.length) % ST.bands.length;
      syncAll();
    });
  });

  /* --- graph toolbar --- */
  $$("#sh-tabs button").forEach(function (b) {
    b.addEventListener("click", function () { ST.tab = b.dataset.tab; syncAll(); });
  });
  $$("#sh-anbtns button[data-an]").forEach(function (b) {
    b.addEventListener("click", function () { ST.analyzerMode = b.dataset.an; syncAll(); });
  });
  var anToggle = $("#sh-an-toggle");
  if (anToggle) anToggle.addEventListener("click", function () {
    ST.analyzerOn = !ST.analyzerOn; syncAll();
  });

  /* --- right-hand button column --- */
  var soloBtn = $("[data-act='solo']"), powBtn = $("[data-act='power']"), scBtn = $("[data-act='sc']");
  if (soloBtn) soloBtn.addEventListener("click", function () { commit(function () { ST.solo = !ST.solo; }); syncAll(); });
  if (powBtn) powBtn.addEventListener("click", function () { commit(function () { ST.power = !ST.power; }); syncAll(); });
  if (scBtn) scBtn.addEventListener("click", function () { commit(function () { ST.sidechain = !ST.sidechain; }); syncAll(); });

  /* --- header: presets, A/B --- */
  var prev = $("[data-preset='prev']"), next = $("[data-preset='next']"), fav = $("[data-preset='fav']");
  if (prev) prev.addEventListener("click", function () { loadPreset(ST.presetIndex - 1); });
  if (next) next.addEventListener("click", function () { loadPreset(ST.presetIndex + 1); });
  if (fav) fav.addEventListener("click", function () {
    fav.setAttribute("aria-pressed", fav.getAttribute("aria-pressed") === "true" ? "false" : "true");
  });
  $$("[data-slot]").forEach(function (b) {
    b.addEventListener("click", function () { commit(function () { ST.slot = b.dataset.slot; }); syncAll(); });
  });
}

/* ---------- sync ----------------------------------------------- */
/* cheap: called every frame and during drags */
function syncReadouts() {
  for (var k in KNOBS) {
    if (k.charAt(0) === "_") continue;
    var d = KNOB_DEFS[k];
    if (d && KNOBS[k] && !KNOBS[k].dragging) KNOBS[k].set(d.get());
  }
}
function syncBandControls() { syncReadouts(); }

/* full: called on structural changes */
function syncAll() {
  var b = selBand();
  if (!b) return;
  var ty = TYPES[b.type];

  /* band identity */
  var num = $("[data-band-number]");
  if (num) num.textContent = "BAND " + (ST.selected + 1);

  /* type dropdown + shape buttons */
  var sel = $(".sh-select");
  if (sel) sel.value = b.type;
  if (KNOBS._shapes) {
    var si = SHAPE_MAP.indexOf(b.type);
    if (si >= 0) KNOBS._shapes.set(si, false);
  }

  /* knob availability — controls that do nothing are not offered */
  setKnobEnabled("gain", ty.gain);
  setKnobEnabled("q", ty.q);
  ["threshold", "range", "attack", "release"].forEach(function (k) {
    setKnobEnabled(k, b.dyn.on);
  });

  /* dynamic pill */
  if (KNOBS._dynPill) KNOBS._dynPill.set(b.dyn.on, false);

  /* segmented groups */
  for (var s in SEGS) if (SEGS[s] && SEGS[s]._sync) SEGS[s]._sync();

  /* graph toolbar */
  $$("#sh-tabs button").forEach(function (x) { press(x, x.dataset.tab === ST.tab); });
  $$("#sh-anbtns button[data-an]").forEach(function (x) { press(x, x.dataset.an === ST.analyzerMode); });
  var anToggle = $("#sh-an-toggle");
  if (anToggle) press(anToggle, ST.analyzerOn);

  /* right column */
  toggleAct("solo", ST.solo);
  toggleAct("power", ST.power);
  toggleAct("sc", ST.sidechain);

  /* header */
  var p = PRESETS[ST.presetIndex];
  var pn = $("[data-preset-name]"), pt = $("[data-preset-tag]");
  if (pn) pn.textContent = p.name;
  if (pt) pt.textContent = p.tag;
  $$("[data-slot]").forEach(function (x) {
    var on = x.dataset.slot === ST.slot;
    press(x, on);
    x.classList.toggle("is-on", on);
  });

  syncReadouts();
}

function setKnobEnabled(key, on) {
  var k = KNOBS[key];
  if (!k || !k.el) return;
  k.el.classList.toggle("is-disabled", !on);
  k.el.setAttribute("aria-disabled", on ? "false" : "true");
  if (k.el.style) { k.el.style.opacity = on ? "" : "0.32"; k.el.style.pointerEvents = on ? "" : "none"; }
}
function toggleAct(name, on) {
  var el = $("[data-act='" + name + "']");
  if (!el) return;
  press(el, on);
  el.classList.toggle("is-on", on);
}

</script>

<script>
(function(){
  function go(){ try { bootEngine(); } catch(e){ console.error("SHAPE boot failed:", e); } }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go);
  else go();
})();
</script>
