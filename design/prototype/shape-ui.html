<title>SHAPE Spectral Equalizer</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap">

<style>
/* ---- page ground: the plugin floats on a neutral desk ---- */
html,body{ background:#7E848B; }
body{
  margin:0; padding-block:22px; padding-inline:16px;
  font-family:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color:#262B33; -webkit-font-smoothing:antialiased;
}
.sh-stage{ max-width:1360px; margin-inline:auto; }
*{ box-sizing:border-box; }
:focus-visible{ outline:2px solid #45C2F0; outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ transition-duration:1ms !important; } }

:root{
  --chassis-hi:#F2F4F6; --chassis:#D4D8DD; --chassis-lo:#AEB4BB; --chassis-edge:#8A9098;
  --panel-hi:#E2E5E9;  --panel:#D0D5DA;   --panel-lo:#BCC2C9;
  --well-bg:#0C0E12;   --well-bg2:#171B21; --well-line:#262B33; --well-edge:#05070A;
  --ink:#262B33; --ink2:#5B636D; --ink3:#878F99;
  --on-dark:#C8CFD8; --on-dark2:#7B838E;
  --amber:#FF9E2C; --cyan:#45C2F0; --violet:#9B7BF0; --green:#6FC98A;
}

/* ============ chassis shell ============ */
.sh-chassis,
.sh-chassis *,
.sh-chassis *::before,
.sh-chassis *::after{ box-sizing:border-box; }

.sh-chassis{
  position:relative;
  isolation:isolate;
  display:flex;
  flex-direction:column;
  width:100%;
  min-width:0;
  border:1px solid var(--chassis-edge);
  border-radius:14px;
  font-family:Inter,system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  background:
    repeating-linear-gradient(0deg,
      rgba(255,255,255,.35) 0px, rgba(255,255,255,.35) 1px,
      rgba(255,255,255,0) 1px, rgba(255,255,255,0) 3px),
    repeating-linear-gradient(0deg,
      rgba(0,0,0,.045) 0px, rgba(0,0,0,.045) 1px,
      rgba(0,0,0,0) 1px, rgba(0,0,0,0) 5px),
    linear-gradient(180deg,
      var(--chassis-hi) 0%,
      var(--chassis) 48%,
      var(--chassis-lo) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 0 rgba(0,0,0,.18),
    inset 1px 0 0 rgba(255,255,255,.34),
    inset -1px 0 0 rgba(0,0,0,.09),
    0 1px 0 rgba(255,255,255,.5),
    0 2px 5px rgba(0,0,0,.16),
    0 22px 46px -14px rgba(0,0,0,.42);
}

/* soft studio-light sweep across the brushed face */
.sh-chassis::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  border-radius:inherit;
  background:
    radial-gradient(130% 58% at 50% -14%, rgba(255,255,255,.55), rgba(255,255,255,0) 62%),
    linear-gradient(100deg,
      rgba(255,255,255,0) 18%,
      rgba(255,255,255,.26) 41%,
      rgba(255,255,255,0) 61%);
}

.sh-chassis button{
  margin:0;
  padding:0;
  border:0;
  background:none;
  font:inherit;
  color:inherit;
  line-height:1;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}
.sh-chassis :focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:3px;
  border-radius:6px;
}

/* ============ header ============ */
.sh-header{
  position:relative;
  z-index:1;
  display:flex;
  flex-wrap:nowrap;
  align-items:center;
  gap:20px;
  height:92px;
  padding:0 26px;
}

/* --- left: wordmark --- */
.sh-brand{
  flex:1 1 0;
  min-width:min-content;
  display:flex;
  flex-direction:column;
  gap:9px;
}
.sh-wordmark{
  font-size:34px;
  font-weight:200;
  line-height:1;
  letter-spacing:.42em;
  margin-right:-.42em;
  color:var(--ink);
  white-space:nowrap;
}
.sh-subword{
  font-size:9.5px;
  font-weight:500;
  line-height:1.2;
  letter-spacing:.28em;
  margin-right:-.28em;
  text-transform:uppercase;
  color:var(--ink2);
}

/* --- centre: preset capsule --- */
.sh-preset{
  flex:0 1 auto;
  display:flex;
  align-items:center;
  gap:2px;
  height:56px;
  min-width:480px;
  max-width:100%;
  padding:0 6px;
  border-radius:999px;
  background:linear-gradient(180deg,#1A1E24,#0E1116);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 3px 9px rgba(0,0,0,.62),
    inset 0 -1px 0 rgba(255,255,255,.04),
    0 1px 0 rgba(255,255,255,.72),
    0 8px 16px -8px rgba(0,0,0,.5);
}
.sh-preset-nav{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  border-radius:999px;
  color:var(--on-dark2);
  transition:color .15s ease, background-color .15s ease;
}
.sh-preset-nav:hover{
  color:var(--on-dark);
  background:rgba(255,255,255,.05);
}
.sh-preset-nav svg{ width:28px; height:28px; display:block; }

.sh-preset-core{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 4px;
}
.sh-preset-pad{ flex:0 0 16px; }
.sh-preset-text{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  text-align:center;
}
.sh-preset-name{
  max-width:100%;
  font-size:17px;
  font-weight:500;
  line-height:1;
  color:var(--cyan);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sh-preset-tags{
  max-width:100%;
  font-size:8.5px;
  font-weight:500;
  line-height:1;
  letter-spacing:.22em;
  margin-right:-.22em;
  text-transform:uppercase;
  color:var(--on-dark2);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sh-fav{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  width:16px;
  height:16px;
  color:var(--on-dark2);
  transition:color .15s ease;
}
.sh-fav:hover{ color:var(--on-dark); }
.sh-fav svg{ width:16px; height:16px; display:block; }

/* --- right: tools --- */
.sh-tools{
  flex:1 1 0;
  min-width:min-content;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:22px;
}
.sh-gear{
  display:flex;
  align-items:center;
  justify-content:center;
  width:20px;
  height:20px;
  color:var(--ink2);
  transition:color .15s ease;
}
.sh-gear:hover{ color:var(--ink); }
.sh-gear svg{ width:20px; height:20px; display:block; }

.sh-ab{
  display:flex;
  align-items:center;
  gap:14px;
}
.sh-ab-slot{
  position:relative;
  font-size:15px;
  font-weight:500;
  line-height:1;
  color:var(--ink3);
  padding-bottom:2px;
  transition:color .15s ease;
}
.sh-ab-slot:hover{ color:var(--ink2); }
.sh-ab-on,.sh-ab-slot.is-on{ color:var(--ink); }
.sh-ab-on:hover,.sh-ab-slot.is-on:hover{ color:var(--ink); }
.sh-ab-on::after,.sh-ab-slot.is-on::after{
  content:"";
  position:absolute;
  left:-1px;
  right:-1px;
  bottom:-5px;
  height:2px;
  border-radius:1px;
  background:var(--amber);
  box-shadow:0 0 6px rgba(255,158,44,.45);
}

.sh-vendor{
  font-size:9px;
  font-weight:500;
  line-height:1;
  letter-spacing:.2em;
  margin-right:-.2em;
  text-transform:uppercase;
  color:var(--ink3);
  padding-bottom:7px;
  border-bottom:1px solid rgba(0,0,0,.15);
  white-space:nowrap;
}

/* ============ body mount ============ */
.sh-chassis > #mount-body{
  position:relative;
  z-index:1;
  flex:1 1 auto;
  min-width:0;
  padding:0 26px 20px;
}

/* ============ footer ============ */
.sh-footer{
  position:relative;
  z-index:1;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:16px;
  height:44px;
  padding:0 20px;
  border-top:1px solid rgba(255,255,255,.5);
  border-radius:0 0 13px 13px;
  background:
    repeating-linear-gradient(0deg,
      rgba(255,255,255,.22) 0px, rgba(255,255,255,.22) 1px,
      rgba(255,255,255,0) 1px, rgba(255,255,255,0) 3px),
    linear-gradient(180deg, var(--panel-lo), var(--chassis-lo));
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.1);
}
.sh-footer-line,
.sh-footer-slash{
  font-size:10px;
  font-weight:500;
  line-height:1;
  letter-spacing:.3em;
  text-transform:uppercase;
  white-space:nowrap;
}
.sh-footer-line{ color:var(--ink2); }
.sh-footer-slash{ color:var(--ink3); }

/* ============ responsive ============ */
@media (max-width:1060px){
  .sh-preset{ min-width:340px; }
}
@media (max-width:820px){
  .sh-header{ gap:16px; padding:0 18px; }
  .sh-preset{ min-width:260px; }
  .sh-tools{ gap:16px; }
  .sh-chassis > #mount-body{ padding:0 18px 16px; }
}
@media (max-width:720px){
  .sh-header{
    flex-wrap:wrap;
    height:auto;
    padding:18px 16px;
    row-gap:16px;
    column-gap:14px;
  }
  .sh-brand{ order:0; flex:1 1 auto; }
  .sh-tools{ order:1; flex:0 1 auto; gap:16px; }
  .sh-preset{
    order:2;
    flex:1 1 100%;
    width:100%;
    min-width:0;
  }
  .sh-wordmark{ font-size:26px; letter-spacing:.34em; margin-right:-.34em; }
  .sh-subword{ font-size:8px; letter-spacing:.2em; margin-right:-.2em; }
  .sh-chassis > #mount-body{ padding:0 16px 16px; }
  .sh-footer{ height:auto; min-height:44px; padding:13px 16px; gap:10px 14px; }
  .sh-footer-line,
  .sh-footer-slash{ font-size:9px; letter-spacing:.26em; }
}
@media (prefers-reduced-motion:reduce){
  .sh-chassis *{ transition:none !important; }
}

/* ---- dark graph well, inset into the brushed chassis ---- */
.sh-graphwrap{
  margin: 0 20px 16px;
  border-radius: 12px;
  padding: 3px;
  /* the milled bezel around the display: dark groove, bright lower lip */
  background: linear-gradient(180deg,#9AA1A9 0%, #C6CCD2 55%, #EDEFF1 100%);
  box-shadow:
    inset 0 2px 4px rgba(0,0,0,.38),
    0 1px 0 rgba(255,255,255,.75);
}
.sh-graph{
  position: relative;
  border-radius: 10px;
  background: linear-gradient(180deg, var(--well-bg2) 0%, var(--well-bg) 68%);
  box-shadow:
    inset 0 1px 12px rgba(0,0,0,.85),
    inset 0 0 0 1px rgba(255,255,255,.045);
  overflow: hidden;
  height: 396px;
}
#shape-graph{ display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }

/* ---- toolbar overlay, floating on the display ---- */
.sh-gbar{
  position:absolute; top:12px; left:14px; right:14px;
  display:flex; align-items:center; gap:10px;
  pointer-events:none;
}
.sh-gbar > *{ pointer-events:auto; }
.sh-gbar-sp{ margin-left:auto; }

.sh-tabs, .sh-anbtns{ display:flex; align-items:center; gap:4px; }

/* a button that sits on the dark display */
.sh-dbtn{
  font: 500 10px/1 Inter, system-ui, sans-serif;
  letter-spacing:.14em; text-transform:uppercase;
  color: var(--on-dark2);
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 7px;
  padding: 8px 13px;
  cursor:pointer;
  transition: color 130ms ease, background 130ms ease, border-color 130ms ease, box-shadow 130ms ease;
  white-space:nowrap;
}
.sh-dbtn:hover{ color: var(--on-dark); background: rgba(255,255,255,.08); }
.sh-dbtn[aria-pressed="true"]{
  color: var(--amber);
  background: linear-gradient(180deg,#2A2118,#1A140E);
  border-color: rgba(255,158,44,.55);
  box-shadow: 0 0 0 1px rgba(255,158,44,.35), 0 0 12px rgba(255,158,44,.28);
}
.sh-dbtn:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

/* the ANALYZER master toggle carries a dot, like the DYNAMIC pill */
.sh-dbtn--dot{ display:inline-flex; align-items:center; gap:7px; }
.sh-dbtn--dot::before{
  content:""; width:6px; height:6px; border-radius:999px;
  background: transparent; border:1px solid currentColor; flex:none;
  transition: all 130ms ease;
}
.sh-dbtn--dot[aria-pressed="true"]::before{
  background: var(--amber); border-color: var(--amber);
  box-shadow: 0 0 6px rgba(255,158,44,.9);
}

@media (max-width: 860px){
  .sh-graph{ height: 320px; }
  .sh-gbar{ top:10px; left:10px; right:10px; gap:6px; flex-wrap:wrap; }
  .sh-dbtn{ padding:7px 10px; letter-spacing:.1em; }
}
@media (max-width: 620px){
  .sh-graphwrap{ margin: 0 12px 12px; }
  .sh-graph{ height: 262px; }
  .sh-gbar-sp{ margin-left:0; }
  .sh-gbar{ position:static; padding:10px 10px 0; }
}

/* ==========================================================================
   SHAPE — controls: metal knob, filter-shape buttons, pill toggle, segmented
   All selectors are namespaced `.sh-`.
   ========================================================================== */

.sh-knob,
.sh-shapes,
.sh-shape-btn,
.sh-pill,
.sh-seg,
.sh-seg-btn{
  --cyan:#45C2F0;
  --amber:#FF9E2C;
  --violet:#9B7BF0;
  --ink:#262B33;
  --ink2:#5B636D;

  --sh-sans: var(--sans, Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);

  --sh-light-face: linear-gradient(180deg,#E8EBEE,#D6DBE0);
  --sh-dark-face:  linear-gradient(180deg,#2A2E35,#191D23);
  --sh-amber-ring: 0 0 0 1px rgba(255,158,44,.7), 0 0 10px rgba(255,158,44,.35);

  box-sizing:border-box;
}
.sh-knob *,
.sh-shapes *,
.sh-pill *,
.sh-seg *{ box-sizing:border-box; }

/* --------------------------------------------------------------------------
   1. The knob
   -------------------------------------------------------------------------- */

.sh-knob{
  --sh-accent:var(--cyan);
  --sh-body:52px;          /* knob body diameter                */
  --sh-box:70px;           /* dial field: body + arc + tick ring */
  --sh-ind-w:2px;
  --sh-ind-h:13px;
  --sh-ind-top:3px;

  width:96px;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:var(--sh-sans);
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.sh-knob--lg{
  --sh-body:72px;
  --sh-box:94px;
  --sh-ind-w:2.5px;
  --sh-ind-h:18px;
  --sh-ind-top:4px;
}

.sh-knob--cyan  { --sh-accent:var(--cyan);   }
.sh-knob--amber { --sh-accent:var(--amber);  }
.sh-knob--violet{ --sh-accent:var(--violet); }

/* the interactive field ----------------------------------------------------*/
.sh-knob-dial{
  position:relative;
  width:var(--sh-box);
  height:var(--sh-box);
  border-radius:50%;
  cursor:ns-resize;
  touch-action:none;
  outline:none;
}
.sh-knob-dial:focus-visible{
  outline:2px solid var(--sh-accent);
  outline-offset:1px;
}
.sh-knob--active .sh-knob-dial{ cursor:grabbing; }

/* ticks + value arc --------------------------------------------------------*/
.sh-knob-svg{
  position:absolute;
  inset:0;
  overflow:visible;
  pointer-events:none;
  display:block;
}
.sh-knob-ticks line{
  stroke:rgba(0,0,0,.28);
  stroke-linecap:butt;
}
.sh-knob-arc,
.sh-knob-arc-glow,
.sh-knob-arc-bloom{
  fill:none;
  stroke:var(--sh-accent);
  stroke-linecap:round;
}
.sh-knob-arc-bloom{ opacity:.42; }
.sh-knob-arc-glow { opacity:.13; }

/* accent light bouncing off the chassis around the base --------------------*/
.sh-knob-halo{
  position:absolute;
  inset:-6px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle closest-side, var(--sh-accent) 58%, rgba(0,0,0,0) 76%);
  opacity:.06;
  filter:blur(7px);
}
.sh-knob-dial:hover .sh-knob-halo,
.sh-knob--active .sh-knob-halo{ opacity:.12; }

/* the machined body --------------------------------------------------------*/
.sh-knob-body{
  position:absolute;
  left:50%; top:50%;
  width:var(--sh-body);
  height:var(--sh-body);
  margin:calc(var(--sh-body) / -2) 0 0 calc(var(--sh-body) / -2);
  border-radius:50%;
  isolation:isolate;
  background:radial-gradient(circle at 38% 30%,
      #FCFCFD 0%,
      #E4E7EA 30%,
      #BFC5CB 62%,
      #9AA1A9 88%,
      #C3C9CF 100%);
  box-shadow:
      0 0 0 1px rgba(0,0,0,.30),
      0 2px 5px rgba(0,0,0,.30),
      0 6px 12px rgba(0,0,0,.10),
      inset 0 1px 1px rgba(255,255,255,.85),
      inset 0 -2px 3px rgba(0,0,0,.16),
      inset 0 0 9px rgba(84,93,105,.26);   /* pulls the dome flat, as a machined face is */
}

/* micro grain — the anodised tooth of the metal */
.sh-knob-body::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  border-radius:50%;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='90' height='90' filter='url(%23n)'/></svg>");
  background-size:90px 90px;
  mix-blend-mode:overlay;
  opacity:.42;
  -webkit-mask:radial-gradient(circle closest-side,
      rgba(0,0,0,.45) 0 12%, #000 34%, #000 84%, rgba(0,0,0,.55) 100%);
  mask:radial-gradient(circle closest-side,
      rgba(0,0,0,.45) 0 12%, #000 34%, #000 84%, rgba(0,0,0,.55) 100%);
}

/* the circular lay left by the lathe, only where it can resolve cleanly */
.sh-knob-lay{
  position:absolute;
  inset:0;
  z-index:2;
  border-radius:50%;
  pointer-events:none;
  background:repeating-conic-gradient(from 0deg,
      rgba(255,255,255,.95) 0deg .55deg,
      rgba(255,255,255,0)   .55deg 1.20deg,
      rgba(0,0,0,.95)       1.20deg 1.75deg,
      rgba(0,0,0,0)         1.75deg 2.55deg);
  mix-blend-mode:overlay;
  opacity:.15;
  -webkit-mask:radial-gradient(circle closest-side,
      rgba(0,0,0,0) 0 48%, #000 74%, #000 88%, rgba(0,0,0,.40) 100%);
  mask:radial-gradient(circle closest-side,
      rgba(0,0,0,0) 0 48%, #000 74%, #000 88%, rgba(0,0,0,.40) 100%);
}

/* anisotropic glint riding the rim */
.sh-knob-body::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:3;
  border-radius:50%;
  background:conic-gradient(from 196deg,
      rgba(255,255,255,0)   0deg,
      rgba(255,255,255,.62) 40deg,
      rgba(255,255,255,0)   94deg,
      rgba(0,0,0,.26)       168deg,
      rgba(255,255,255,0)   238deg,
      rgba(255,255,255,.20) 302deg,
      rgba(255,255,255,0)   344deg);
  -webkit-mask:radial-gradient(circle closest-side,
      rgba(0,0,0,0) 0 78%, #000 90%, #000 100%);
  mask:radial-gradient(circle closest-side,
      rgba(0,0,0,0) 0 78%, #000 90%, #000 100%);
}

/* indicator ---------------------------------------------------------------*/
.sh-knob-rot{
  position:absolute;
  inset:0;
  z-index:4;
  transform:rotate(-135deg);
  will-change:transform;
}
.sh-knob-ind{
  position:absolute;
  left:50%;
  top:var(--sh-ind-top);
  width:var(--sh-ind-w);
  height:var(--sh-ind-h);
  margin-left:calc(var(--sh-ind-w) / -2);
  border-radius:calc(var(--sh-ind-w) / 2);
  background:#2A2F36;
  box-shadow:.5px .5px 0 rgba(255,255,255,.45);
}

/* label + readout ---------------------------------------------------------*/
.sh-knob-label{
  margin-top:9px;
  font-size:9.5px;
  font-weight:500;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink2);
  white-space:nowrap;
  text-align:center;
}
.sh-knob-value{
  margin-top:3px;
  font-size:13.5px;
  font-weight:500;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  text-align:center;
}

/* large variant: a three-stop scale instead of the label / readout stack ---*/
.sh-knob-scale{
  margin-top:8px;
  width:calc(var(--sh-body) + 6px);
  display:flex;

/* ============================================================
   SHAPE — Row 1 (band strip) + Row 2 (bottom bar)
   All selectors namespaced with .sh-
   ============================================================ */

.sh-bandstrip,
.sh-bottombar{
  --chassis-hi:#F2F4F6;
  --chassis:#D4D8DD;
  --chassis-lo:#AEB4BB;
  --panel-hi:#E2E5E9;
  --panel:#D0D5DA;
  --panel-lo:#BCC2C9;
  --ink:#262B33;
  --ink2:#5B636D;
  --ink3:#878F99;
  --amber:#FF9E2C;
  --cyan:#45C2F0;
  --violet:#9B7BF0;

  --sh-knob-w:56px;
  --sh-knob-h:76px;
  --sh-knob-w-lg:74px;
  --sh-knob-h-lg:96px;

  font-family:Inter, system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  max-width:100%;
}

.sh-bandstrip,
.sh-bandstrip *,
.sh-bottombar,
.sh-bottombar *{ box-sizing:border-box; }


/* ------------------------------------------------------------
   Shared: milled groove divider
   ------------------------------------------------------------ */
.sh-divider{
  flex:0 0 1px;
  width:1px;
  align-self:stretch;
  position:relative;
  margin:0 18px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.18),transparent);
}
.sh-divider::after{
  content:"";
  position:absolute;
  top:0; left:1px;
  width:1px; height:100%;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.6),transparent);
}
.sh-divider--bar{
  margin:0 26px;
  min-height:72px;
}


/* ------------------------------------------------------------
   Shared: mount-point reservations (filled by other components)
   ------------------------------------------------------------ */
.sh-knobmount{
  flex:0 0 auto;
  width:var(--sh-knob-w);
  min-height:var(--sh-knob-h);
}
.sh-knobmount[data-size="lg"]{
  width:var(--sh-knob-w-lg);
  min-height:var(--sh-knob-h-lg);
}
.sh-bandstrip .sh-shapebtns{ min-height:30px; min-width:0; }
.sh-pillmount{ min-height:26px; min-width:96px; }
.sh-segmount{ min-height:30px; min-width:148px; max-width:100%; }


/* ============================================================
   ROW 1 — THE BAND STRIP
   ============================================================ */
.sh-bandstrip{
  display:flex;
  align-items:stretch;
  column-gap:0;
  row-gap:14px;
  padding:16px 20px;
  border-radius:10px;
  background:linear-gradient(180deg,var(--panel-hi),var(--panel));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 -1px 0 rgba(0,0,0,.06),
    0 1px 2px rgba(0,0,0,.10),
    0 4px 10px rgba(0,0,0,.09);
}

/* (a) band identity column ---------------------------------- */
.sh-bandid{
  flex:0 0 150px;
  width:150px;
  min-width:0;
  margin-right:18px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.sh-bandid-top{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.sh-dot{
  flex:0 0 auto;
  width:7px; height:7px;
  border-radius:50%;
  background:var(--amber);
  box-shadow:
    0 0 5px rgba(255,158,44,.95),
    0 0 12px rgba(255,158,44,.45);
}

.sh-bandlabel{
  min-width:0;
  font-size:12px;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sh-chevrons{
  margin-left:auto;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:2px;
}
.sh-chev{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  padding:0;
  background:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  width:22px; height:22px;
  color:var(--ink3);
  border-radius:5px;
  transition:color .12s ease, background-color .12s ease;
}
.sh-chev:hover{ color:var(--ink); background:rgba(255,255,255,.5); }
.sh-chev:active{ background:rgba(0,0,0,.05); }
.sh-chev svg{ display:block; width:22px; height:22px; }

/* select --------------------------------------------------- */
.sh-select{
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
  width:100%;
  min-width:0;
  height:34px;
  padding:0 30px 0 12px;
  border-radius:7px;
  border:1px solid rgba(0,0,0,.16);
  font-family:inherit;
  font-size:12px;
  font-weight:500;
  color:var(--ink);
  cursor:pointer;
  outline:none;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    0 1px 1px rgba(0,0,0,.06);
  background-image:
    linear-gradient(45deg,transparent 50%,var(--ink2) 50%),
    linear-gradient(135deg,var(--ink2) 50%,transparent 50%),
    linear-gradient(180deg,var(--panel-hi),var(--panel));
  background-position:
    calc(100% - 18px) calc(50% - 1px),
    calc(100% - 13px) calc(50% - 1px),
    0 0;
  background-size:5px 5px, 5px 5px, 100% 100%;
  background-repeat:no-repeat, no-repeat, no-repeat;
  transition:border-color .12s ease, box-shadow .12s ease;
}
.sh-select:hover{ border-color:rgba(0,0,0,.24); }
.sh-select:focus-visible{
  border-color:rgba(255,158,44,.75);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    0 0 0 2px rgba(255,158,44,.28);
}

/* (b) core knob group --------------------------------------- */
.sh-knobgroup{
  flex:0 0 auto;
  display:flex;
  align-items:flex-start;
  gap:12px;
}

/* (d) dynamic group ----------------------------------------- */
.sh-dyngroup{
  flex:0 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:12px;
}
.sh-dynknobs{
  display:flex;
  align-items:flex-start;
  gap:12px;
}

/* (e) right-hand button column ------------------------------ */
.sh-btncol{
  margin-left:auto;
  flex:0 0 auto;
  width:62px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:9px;
}

.sh-minibtn{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  height:34px;
  padding:0;
  border-radius:8px;
  border:1px solid rgba(0,0,0,.16);
  background:linear-gradient(180deg,var(--panel-hi),var(--panel));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    0 1px 2px rgba(0,0,0,.10);
  font-family:inherit;
  font-size:10px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--ink2);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:color .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;
}
.sh-minibtn:hover{ color:var(--ink); border-color:rgba(0,0,0,.22); }
.sh-minibtn:active{
  box-shadow:inset 0 2px 4px rgba(0,0,0,.16);
  background:linear-gradient(180deg,var(--panel),var(--panel-lo));
}
.sh-minibtn.is-on{
  background:linear-gradient(180deg,#333A44,#1E232B);
  border-color:rgba(0,0,0,.55);
  color:var(--amber);
  text-shadow:0 0 8px rgba(255,158,44,.55);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 0 0 1px rgba(255,158,44,.42),
    0 0 10px rgba(255,158,44,.38),
    0 1px 2px rgba(0,0,0,.28);
}

.sh-powerbtn{
  appearance:none;
  -webkit-appearance:none;
  flex:0 0 auto;
  width:38px; height:38px;
  padding:0;
  border-radius:50%;
  border:1px solid rgba(0,0,0,.16);
  background:linear-gradient(180deg,var(--panel-hi),var(--panel));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    0 1px 2px rgba(0,0,0,.10);
  color:var(--ink2);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:color .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;
}
.sh-powerbtn:hover{ color:var(--ink); border-color:rgba(0,0,0,.22); }
.sh-powerbtn:active{
  box-shadow:inset 0 2px 4px rgba(0,0,0,.16);
  background:linear-gradient(180deg,var(--panel),var(--panel-lo));
}
.sh-powerbtn svg{ display:block; width:19px; height:19px; }
.sh-powerbtn.is-on{
  color:var(--amber);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 0 0 1px rgba(255,158,44,.40),
    0 0 12px rgba(255,158,44,.45),
    0 1px 2px rgba(0,0,0,.12);
}
.sh-powerbtn.is-on svg{ filter:drop-shadow(0 0 5px rgba(255,158,44,.75)); }


/* ============================================================
   ROW 2 — THE BOTTOM BAR (milled straight into the chassis)
   ============================================================ */
.sh-bottombar{
  display:flex;
  align-items:center;
  padding:18px 26px;
  background:transparent;
  border-top:1px solid rgba(0,0,0,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
}

.sh-cap{
  display:block;
  margin-bottom:8px;
  font-size:10px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.18em;
  color:var(--ink2);
  white-space:nowrap;
}

.sh-iocell{
  flex:0 0 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.sh-segzone{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:space-around;
  flex-wrap:wrap;
  gap:14px 20px;
}

.sh-segcell{
  flex:0 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
}


/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:900px){
  .sh-bandstrip{ flex-wrap:wrap; }
  .sh-bandid   { order:1; }
  .sh-knobgroup{ order:2; }
  .sh-bandstrip > .sh-divider{ order:3; }
  .sh-btncol{
    order:4;
    width:auto;
    flex-direction:row;
    align-items:center;
    gap:9px;
  }
  .sh-btncol .sh-minibtn{ width:62px; }
  .sh-dyngroup{
    order:5;
    flex:1 1 100%;
    width:100%;
  }

  /* bottom bar: INPUT / OUTPUT hold the line, selectors drop beneath */
  .sh-bottombar{ flex-wrap:wrap; row-gap:18px; }
  .sh-bottombar > .sh-divider--bar{ display:none; }
  .sh-iocell--in { order:1; }
  .sh-iocell--out{ order:2; margin-left:auto; }
  .sh-segzone{
    order:3;
    flex:1 1 100%;
    width:100%;
  }
}

@media (max-width:720px){
  .sh-bandstrip{ padding:14px 16px; }

  /* knob mounts: two per line */
  .sh-knobgroup,
  .sh-dynknobs{
    flex-wrap:wrap;
    max-width:calc(var(--sh-knob-w) * 2 + 12px);
  }

  .sh-bandid{ margin-right:14px; }

  /* dividers are milled away */
  .sh-divider{ display:none; }

  .sh-bottombar{
    flex-direction:column;
    align-items:center;
    gap:20px;
    padding:18px 16px;
  }
  .sh-iocell--in { order:1; }
  .sh-iocell--out{ order:3; margin-left:0; }
  .sh-segzone{
    order:2;
    width:100%;
    flex-wrap:wrap;
    justify-content:center;
    gap:18px 24px;
  }
}

/* ---- integration overrides (last, so they win) ----
   Each reconciles two parts that were authored independently. */

/* The chassis already gutters #mount-body; the graph must not add its own. */
.sh-chassis > #mount-body > .sh-graphwrap{ margin-left:0; margin-right:0; }

/* Knob mounts reserved 56px before the knob's real cell width was known.
   Let the knob size the mount instead of clipping it. */
.sh-knobmount{ width:auto !important; min-width:0 !important; }
.sh-knobgroup, .sh-dynknobs{ max-width:none !important; flex-wrap:wrap; }

/* Disabled knobs: the wiring marks controls that do nothing for this
   filter type, rather than offering them. */
.sh-knob.is-disabled{ opacity:.32; pointer-events:none; }

/* Keep the whole instrument off the horizontal scrollbar. */
.sh-chassis, .sh-bandstrip, .sh-bottombar{ max-width:100%; }

/* --- cascade repair ---
   The chassis part resets .sh-chassis button (0,1,1), which outranks the
   other parts' single-class button rules (0,1,0) and was stripping their
   padding, border and background. Restore them at (0,2,0). The .sh-on
   states already outrank the reset, so only the base needs re-asserting. */
.sh-chassis .sh-dbtn{
  padding:8px 13px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.045);
  border-radius:7px;
  /* the reset's color:inherit was handing these dark chassis ink on a
     near-black panel, which made the inactive labels unreadable */
  color:#98A1AC;
}
.sh-chassis .sh-dbtn:hover{ background:rgba(255,255,255,.09); color:#C8CFD8; }
.sh-chassis .sh-dbtn[aria-pressed="true"]{ color:#FF9E2C; }

.sh-chassis .sh-seg-btn{
  height:32px; padding:0 18px; border-radius:7px;

  background:linear-gradient(180deg,#F2F4F6,#D9DEE3);
}
.sh-chassis .sh-pill{
  height:30px; padding:0 16px; border-radius:999px;
  border:1px solid rgba(0,0,0,.14);
  background:linear-gradient(180deg,#F2F4F6,#D9DEE3);
}
.sh-chassis .sh-shape-btn{
  width:34px; height:34px; padding:0; border-radius:7px;
  border:1px solid rgba(0,0,0,.14);
  background:linear-gradient(180deg,#E8EBEE,#D6DBE0);
}
.sh-chassis .sh-minibtn,
.sh-chassis .sh-powerbtn{ padding:0; }

/* The factories mark state with .sh-on; re-assert the dark+amber face at a
   specificity the reset cannot reach, and keep aria-pressed in step. */
.sh-chassis .sh-seg-btn.sh-on,
.sh-chassis .sh-pill.sh-on,
.sh-chassis .sh-shape-btn.sh-on{
  background:linear-gradient(180deg,#333A44,#1E232B);
  border-color:rgba(0,0,0,.55);
  color:#FF9E2C;
  box-shadow:
    inset 0 0 0 1px rgba(255,158,44,.42),
    inset 0 1px 0 rgba(255,255,255,.09),
    0 0 10px rgba(255,158,44,.38);
}
