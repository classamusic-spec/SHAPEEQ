<style>
/* ---- the display, milled into the faceplate ---- */
.sh-graphwrap{
  margin: 0 0 12px;
  border-radius: 16px;
  padding: 4px;
  /* the bezel: a machined lip, shadowed above and catching light below */
  background: linear-gradient(180deg, #8F969E 0%, #B9BFC6 22%, #E6E9EC 78%, #F7F8F9 100%);
  box-shadow:
    inset 0 1px 1px rgba(0,0,0,.35),
    inset 0 -1px 0 rgba(255,255,255,.9),
    0 1px 0 rgba(255,255,255,.8);
}
.sh-graph{
  position: relative;
  border-radius: 12px;
  background: #0C0F13;
  box-shadow:
    inset 0 2px 14px rgba(0,0,0,.9),
    inset 0 0 0 1px rgba(0,0,0,.8),
    inset 0 0 0 2px rgba(255,255,255,.035);
  overflow: hidden;
  height: 400px;
}
/* a faint sheen across the glass */
.sh-graph::after{
  content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background:
    linear-gradient(180deg, rgba(255,255,255,.045) 0%, rgba(255,255,255,0) 26%),
    radial-gradient(120% 60% at 50% -10%, rgba(120,170,230,.06), rgba(0,0,0,0) 60%);
}
#shape-graph{ display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }

/* ---- toolbar: two joined groups floating on the glass ---- */
.sh-gbar{
  position:absolute; top:15px; left:26px; right:50px; z-index:2;
  display:flex; align-items:center; gap:10px;
  pointer-events:none;
}
.sh-gbar > *{ pointer-events:auto; }
.sh-gbar-sp{ flex:1 1 auto; }

.sh-dgroup{
  display:inline-flex; align-items:stretch;
  height:30px;
  border-radius:8px;
  background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.09), 0 1px 2px rgba(0,0,0,.5);
}
.sh-chassis .sh-dbtn{
  position:relative;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-width:78px; padding:0 18px;
  font: 500 10px/1 Inter, system-ui, sans-serif;
  letter-spacing:.14em; text-transform:uppercase;
  color:#AEB6C0;
  background:transparent;
  border:0;
  border-radius:8px;
  cursor:pointer;
  transition: color 140ms ease, background 140ms ease, box-shadow 140ms ease;
  white-space:nowrap;
}
.sh-chassis .sh-dbtn + .sh-dbtn::before{
  content:""; position:absolute; left:0; top:7px; bottom:7px; width:1px;
  background: rgba(255,255,255,.10);
}
.sh-chassis .sh-dbtn:hover{ color:#E4E9EF; }

/* amber: the active page and the analyser power — and only those */
.sh-chassis .sh-dbtn.is-amber[aria-pressed="true"]{
  color:#FFB25C;
  background: linear-gradient(180deg, rgba(255,158,44,.16), rgba(255,120,20,.07));
  box-shadow:
    inset 0 0 0 1px rgba(255,158,44,.85),
    0 0 12px rgba(255,140,30,.38),
    inset 0 0 10px rgba(255,140,30,.12);
  text-shadow: 0 0 8px rgba(255,150,40,.45);
}
.sh-chassis .sh-dbtn.is-amber[aria-pressed="true"] + .sh-dbtn::before,
.sh-chassis .sh-dbtn.is-amber[aria-pressed="true"]::before{ opacity:0; }

/* the analyser source is a quieter choice: bright text, no ring */
.sh-chassis .sh-dbtn.is-src[aria-pressed="true"]{
  color:#FFFFFF;
  background: rgba(255,255,255,.07);
}
.sh-chassis #sh-anbtns[data-off="1"] .sh-dbtn.is-src{ color:#5E6670; pointer-events:none; }

.sh-chassis .sh-dbtn:focus-visible{ outline:2px solid #45C2F0; outline-offset:2px; }

@media (max-width: 900px){
  .sh-graph{ height: 330px; }
  .sh-chassis .sh-dbtn{ min-width:0; padding:0 12px; letter-spacing:.1em; }
}
@media (max-width: 640px){
  .sh-graph{ height: 300px; }
  .sh-gbar{ left:10px; right:10px; top:10px; flex-wrap:wrap; gap:6px; }
  .sh-gbar-sp{ display:none; }
  .sh-chassis .sh-dbtn{ padding:0 9px; font-size:9px; }
}
</style>

<div class="sh-graphwrap">
  <div class="sh-graph">
    <canvas id="shape-graph" aria-label="Equalizer response curve and spectrum analyser"></canvas>
    <div class="sh-gbar">
      <div class="sh-dgroup" id="sh-tabs" role="group" aria-label="Editor emphasis">
        <button type="button" class="sh-dbtn is-amber" data-tab="eq" aria-pressed="true">EQ</button>
        <button type="button" class="sh-dbtn is-amber" data-tab="dynamic" aria-pressed="false">Dynamic</button>
        <button type="button" class="sh-dbtn is-amber" data-tab="spectral" aria-pressed="false">Spectral</button>
      </div>
      <div class="sh-gbar-sp"></div>
      <div class="sh-dgroup" id="sh-anbtns" role="group" aria-label="Analyser">
        <button type="button" class="sh-dbtn is-amber" id="sh-an-toggle" aria-pressed="true">Analyzer</button>
        <button type="button" class="sh-dbtn is-src" data-an="pre" aria-pressed="true">Pre</button>
        <button type="button" class="sh-dbtn is-src" data-an="post" aria-pressed="false">Post</button>
        <button type="button" class="sh-dbtn is-src" data-an="both" aria-pressed="false">Both</button>
      </div>
    </div>
  </div>
</div>
