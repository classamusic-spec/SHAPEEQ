<style>
:root{
  --chassis-hi:#F2F4F6; --chassis:#D4D8DD; --chassis-lo:#AEB4BB; --chassis-edge:#8A9098;
  --panel-hi:#E2E5E9;  --panel:#D0D5DA;   --panel-lo:#BCC2C9;
  --well-bg:#0C0E12;   --well-bg2:#171B21; --well-line:#262B33; --well-edge:#05070A;
  --ink:#262B33; --ink2:#5B636D; --ink3:#878F99;
  --on-dark:#C8CFD8; --on-dark2:#7B838E;
  --amber:#FF9E2C; --cyan:#45C2F0; --violet:#9B7BF0; --green:#6FC98A;
}

/* ============ chassis shell ============ */
.sh-chassis,
.sh-chassis *,
.sh-chassis *::before,
.sh-chassis *::after{ box-sizing:border-box; }

.sh-chassis{
  position:relative;
  isolation:isolate;
  display:flex;
  flex-direction:column;
  width:100%;
  min-width:0;
  border:1px solid var(--chassis-edge);
  border-radius:14px;
  font-family:Inter,system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  background:
    repeating-linear-gradient(0deg,
      rgba(255,255,255,.35) 0px, rgba(255,255,255,.35) 1px,
      rgba(255,255,255,0) 1px, rgba(255,255,255,0) 3px),
    repeating-linear-gradient(0deg,
      rgba(0,0,0,.045) 0px, rgba(0,0,0,.045) 1px,
      rgba(0,0,0,0) 1px, rgba(0,0,0,0) 5px),
    linear-gradient(180deg,
      var(--chassis-hi) 0%,
      var(--chassis) 48%,
      var(--chassis-lo) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 0 rgba(0,0,0,.18),
    inset 1px 0 0 rgba(255,255,255,.34),
    inset -1px 0 0 rgba(0,0,0,.09),
    0 1px 0 rgba(255,255,255,.5),
    0 2px 5px rgba(0,0,0,.16),
    0 22px 46px -14px rgba(0,0,0,.42);
}

/* soft studio-light sweep across the brushed face */
.sh-chassis::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  border-radius:inherit;
  background:
    radial-gradient(130% 58% at 50% -14%, rgba(255,255,255,.55), rgba(255,255,255,0) 62%),
    linear-gradient(100deg,
      rgba(255,255,255,0) 18%,
      rgba(255,255,255,.26) 41%,
      rgba(255,255,255,0) 61%);
}

.sh-chassis button{
  margin:0;
  padding:0;
  border:0;
  background:none;
  font:inherit;
  color:inherit;
  line-height:1;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}
.sh-chassis :focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:3px;
  border-radius:6px;
}

/* ============ header ============ */
.sh-header{
  position:relative;
  z-index:1;
  display:flex;
  flex-wrap:nowrap;
  align-items:center;
  gap:20px;
  height:92px;
  padding:0 26px;
}

/* --- left: wordmark --- */
.sh-brand{
  flex:1 1 0;
  min-width:min-content;
  display:flex;
  flex-direction:column;
  gap:9px;
}
.sh-wordmark{
  font-size:34px;
  font-weight:200;
  line-height:1;
  letter-spacing:.42em;
  margin-right:-.42em;
  color:var(--ink);
  white-space:nowrap;
}
.sh-subword{
  font-size:9.5px;
  font-weight:500;
  line-height:1.2;
  letter-spacing:.28em;
  margin-right:-.28em;
  text-transform:uppercase;
  color:var(--ink2);
}

/* --- centre: preset capsule --- */
.sh-preset{
  flex:0 1 auto;
  display:flex;
  align-items:center;
  gap:2px;
  height:56px;
  min-width:480px;
  max-width:100%;
  padding:0 6px;
  border-radius:999px;
  background:linear-gradient(180deg,#1A1E24,#0E1116);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 3px 9px rgba(0,0,0,.62),
    inset 0 -1px 0 rgba(255,255,255,.04),
    0 1px 0 rgba(255,255,255,.72),
    0 8px 16px -8px rgba(0,0,0,.5);
}
.sh-preset-nav{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  border-radius:999px;
  color:var(--on-dark2);
  transition:color .15s ease, background-color .15s ease;
}
.sh-preset-nav:hover{
  color:var(--on-dark);
  background:rgba(255,255,255,.05);
}
.sh-preset-nav svg{ width:28px; height:28px; display:block; }

.sh-preset-core{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 4px;
}
.sh-preset-pad{ flex:0 0 16px; }
.sh-preset-text{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  text-align:center;
}
.sh-preset-name{
  max-width:100%;
  font-size:17px;
  font-weight:500;
  line-height:1;
  color:var(--cyan);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sh-preset-tags{
  max-width:100%;
  font-size:8.5px;
  font-weight:500;
  line-height:1;
  letter-spacing:.22em;
  margin-right:-.22em;
  text-transform:uppercase;
  color:var(--on-dark2);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sh-fav{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  width:16px;
  height:16px;
  color:var(--on-dark2);
  transition:color .15s ease;
}
.sh-fav:hover{ color:var(--on-dark); }
.sh-fav svg{ width:16px; height:16px; display:block; }

/* --- right: tools --- */
.sh-tools{
  flex:1 1 0;
  min-width:min-content;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:22px;
}
.sh-gear{
  display:flex;
  align-items:center;
  justify-content:center;
  width:20px;
  height:20px;
  color:var(--ink2);
  transition:color .15s ease;
}
.sh-gear:hover{ color:var(--ink); }
.sh-gear svg{ width:20px; height:20px; display:block; }

.sh-ab{
  display:flex;
  align-items:center;
  gap:14px;
}
.sh-ab-slot{
  position:relative;
  font-size:15px;
  font-weight:500;
  line-height:1;
  color:var(--ink3);
  padding-bottom:2px;
  transition:color .15s ease;
}
.sh-ab-slot:hover{ color:var(--ink2); }
.sh-ab-on,.sh-ab-slot.is-on{ color:var(--ink); }
.sh-ab-on:hover,.sh-ab-slot.is-on:hover{ color:var(--ink); }
.sh-ab-on::after,.sh-ab-slot.is-on::after{
  content:"";
  position:absolute;
  left:-1px;
  right:-1px;
  bottom:-5px;
  height:2px;
  border-radius:1px;
  background:var(--amber);
  box-shadow:0 0 6px rgba(255,158,44,.45);
}

.sh-vendor{
  font-size:9px;
  font-weight:500;
  line-height:1;
  letter-spacing:.2em;
  margin-right:-.2em;
  text-transform:uppercase;
  color:var(--ink3);
  padding-bottom:7px;
  border-bottom:1px solid rgba(0,0,0,.15);
  white-space:nowrap;
}

/* ============ body mount ============ */
.sh-chassis > #mount-body{
  position:relative;
  z-index:1;
  flex:1 1 auto;
  min-width:0;
  padding:0 26px 20px;
}

/* ============ footer ============ */
.sh-footer{
  position:relative;
  z-index:1;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:16px;
  height:44px;
  padding:0 20px;
  border-top:1px solid rgba(255,255,255,.5);
  border-radius:0 0 13px 13px;
  background:
    repeating-linear-gradient(0deg,
      rgba(255,255,255,.22) 0px, rgba(255,255,255,.22) 1px,
      rgba(255,255,255,0) 1px, rgba(255,255,255,0) 3px),
    linear-gradient(180deg, var(--panel-lo), var(--chassis-lo));
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.1);
}
.sh-footer-line,
.sh-footer-slash{
  font-size:10px;
  font-weight:500;
  line-height:1;
  letter-spacing:.3em;
  text-transform:uppercase;
  white-space:nowrap;
}
.sh-footer-line{ color:var(--ink2); }
.sh-footer-slash{ color:var(--ink3); }

/* ============ responsive ============ */
@media (max-width:1060px){
  .sh-preset{ min-width:340px; }
}
@media (max-width:820px){
  .sh-header{ gap:16px; padding:0 18px; }
  .sh-preset{ min-width:260px; }
  .sh-tools{ gap:16px; }
  .sh-chassis > #mount-body{ padding:0 18px 16px; }
}
@media (max-width:720px){
  .sh-header{
    flex-wrap:wrap;
    height:auto;
    padding:18px 16px;
    row-gap:16px;
    column-gap:14px;
  }
  .sh-brand{ order:0; flex:1 1 auto; }
  .sh-tools{ order:1; flex:0 1 auto; gap:16px; }
  .sh-preset{
    order:2;
    flex:1 1 100%;
    width:100%;
    min-width:0;
  }
  .sh-wordmark{ font-size:26px; letter-spacing:.34em; margin-right:-.34em; }
  .sh-subword{ font-size:8px; letter-spacing:.2em; margin-right:-.2em; }
  .sh-chassis > #mount-body{ padding:0 16px 16px; }
  .sh-footer{ height:auto; min-height:44px; padding:13px 16px; gap:10px 14px; }
  .sh-footer-line,
  .sh-footer-slash{ font-size:9px; letter-spacing:.26em; }
}
@media (prefers-reduced-motion:reduce){
  .sh-chassis *{ transition:none !important; }
}
</style>

<div class="sh-chassis">
  <header class="sh-header">

    <div class="sh-brand">
      <div class="sh-wordmark">SHAPE</div>
      <div class="sh-subword">PRECISION SPECTRAL EQUALIZER</div>
    </div>

    <div class="sh-preset">
      <button class="sh-preset-nav" type="button" data-preset="prev" aria-label="Previous preset">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <path d="M14.5 5.5 8 12l6.5 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="sh-preset-core">
        <span class="sh-preset-pad" aria-hidden="true"></span>
        <div class="sh-preset-text">
          <div class="sh-preset-name" data-preset-name>Master Clean</div>
          <div class="sh-preset-tags" data-preset-tag>PRECISION · MUSICAL · NATURAL</div>
        </div>
        <button class="sh-fav" type="button" data-preset="fav" aria-label="Add preset to favourites" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <button class="sh-preset-nav" type="button" data-preset="next" aria-label="Next preset">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <path d="M9.5 5.5 16 12l-6.5 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="sh-tools">
      <button class="sh-gear" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="5.6"/>
          <circle cx="12" cy="12" r="2.3"/>
          <path d="M12 6.4V3.8M12 17.6v2.6M17.6 12h2.6M3.8 12h2.6M15.96 8.04 17.8 6.2M6.2 17.8l1.84-1.84M15.96 15.96 17.8 17.8M6.2 6.2l1.84 1.84"/>
        </svg>
      </button>

      <div class="sh-ab">
        <button class="sh-ab-slot sh-ab-on is-on" type="button" data-slot="A" aria-label="Snapshot A" aria-pressed="true">A</button>
        <button class="sh-ab-slot" type="button" data-slot="B" aria-label="Snapshot B" aria-pressed="false">B</button>
      </div>

      <div class="sh-vendor">BY NOVA AUDIO</div>
    </div>

  </header>

  <div id="mount-body"><!-- graph well, band strip and bottom bar mount here --></div>

  <footer class="sh-footer">
    <span class="sh-footer-line">SHAPE THE SPECTRUM</span>
    <span class="sh-footer-slash" aria-hidden="true">/</span>
    <span class="sh-footer-line">REVEAL THE EMOTION</span>
  </footer>
</div>
